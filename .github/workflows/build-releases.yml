        if: matrix.enabled
        shell: bash
        run: |
          set -euo pipefail
          "$VERIFIER" - <<'PY'
          import json
          import os
          from pathlib import Path
          import nibabel as nib
          from nibabel.streamlines import Field
          import numpy as np

          root = Path(os.environ["RUNNER_TEMP"]) / "scientific"
          root.mkdir(parents=True, exist_ok=True)
          affine = np.diag([2.0, 2.0, 2.0, 1.0])
          affine[:3, 3] = [10.0, 20.0, 30.0]
          voxels = (
              np.array([[1, 1, 1], [2, 1, 1], [3, 1, 1]], dtype=np.float32),
              np.array([[2, 1, 1], [2, 2, 1]], dtype=np.float32),
          )
          streamlines = [nib.affines.apply_affine(affine, points) for points in voxels]
          tractogram = nib.streamlines.Tractogram(
              streamlines,
              data_per_point={"fa": [
                  np.array([[0.2], [0.3], [0.4]], dtype=np.float32),
                  np.array([[0.5], [0.6]], dtype=np.float32),
              ]},
              data_per_streamline={"score": np.array([[1.25], [2.5]], dtype=np.float32)},
              affine_to_rasmm=np.eye(4),
          )
          header = {
              Field.VOXEL_TO_RASMM: affine,
              Field.DIMENSIONS: (6, 6, 6),
              Field.VOXEL_SIZES: (2.0, 2.0, 2.0),
              Field.VOXEL_ORDER: "RAS",
          }
          nib.streamlines.save(
              nib.streamlines.TrkFile(tractogram, header), str(root / "input.trk")
          )
          anat = nib.Nifti1Image(np.ones((6, 6, 6), dtype=np.int16), affine)
          anat.set_sform(affine, code=2)
          anat.set_qform(affine, code=1)
          anat.header.set_intent("t test")
          anat.header.set_slope_inter(2.0, 0.0)
          nib.save(anat, root / "anat.nii.gz")
          (root / "invalid.trk").write_bytes(b"not a tractogram")
          (root / "fixture.json").write_text(
              json.dumps({"voxel_streamlines": [points.tolist() for points in voxels],
                          "affine": affine.tolist()})
          )
          PY
