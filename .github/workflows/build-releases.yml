      - name: Check DEB XCB plugin dependencies
        if: matrix.enabled && matrix.target == 'deb'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["EXECUTABLE"]).parent
          internal = root / "_internal"
          plugins = sorted(internal.rglob("libqxcb.so"))
          if not plugins:
              raise RuntimeError("The DEB payload has no Qt XCB platform plugin")
          env = os.environ.copy()
          # Match the library directory prepended by the PyInstaller bootloader.
          env["LD_LIBRARY_PATH"] = str(internal) + (
              ":" + env["LD_LIBRARY_PATH"] if env.get("LD_LIBRARY_PATH") else ""
          )
          failed = False
          with Path("evidence/xcb-dependencies.log").open("w") as log:
              for plugin in plugins:
                  result = subprocess.run(
                      ["ldd", str(plugin)], env=env, capture_output=True,
                      text=True, timeout=30
                  )
                  text = f"{plugin}\n{result.stdout}{result.stderr}\n"
                  print(text)
                  log.write(text)
                  failed |= result.returncode != 0 or "not found" in text
          if failed:
              raise RuntimeError("Unresolved DEB XCB dependencies; see xcb-dependencies.log")

      - name: Prepare native GUI probe
        if: matrix.enabled && matrix.target != 'appimage'
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          script = Path(os.environ["RUNNER_TEMP"]) / "package-gui-probe.py"
          script.write_text(r'''
          import ctypes
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time
          import psutil

          evidence = Path(os.environ["GITHUB_WORKSPACE"]) / "evidence"
          title = "TractEdit GUI - Interactive Editor"
          report = {"passed": False, "startup_limit_seconds": 90}
          process = None
          owned = set()
          interrupted = None

          def on_signal(signum, frame):
              global interrupted
              interrupted = signum

          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)

          def check_signal():
              if interrupted is not None:
                  raise RuntimeError(f"GUI probe interrupted by signal {interrupted}")

          def live(item):
              try:
                  return item.is_running() and item.status() != psutil.STATUS_ZOMBIE
              except psutil.NoSuchProcess:
                  return False

          def refresh_owned():
              for item in list(owned):
                  try:
                      owned.update(item.children(recursive=True))
                  except psutil.NoSuchProcess:
                      pass
              return {item.pid for item in owned if live(item)}

          def windows(pids):
              if sys.platform == "win32":
                  from ctypes import wintypes
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  callback_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
                  user.EnumWindows.argtypes = [callback_type, wintypes.LPARAM]
                  user.EnumWindows.restype = wintypes.BOOL
                  user.IsWindowVisible.argtypes = [wintypes.HWND]
                  user.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.DWORD)]
                  user.GetWindowTextW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
                  user.GetWindowRect.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.RECT)]
                  found = []
                  @callback_type
                  def visit(hwnd, param):
                      pid = wintypes.DWORD()
                      user.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
                      text = ctypes.create_unicode_buffer(1024)
                      user.GetWindowTextW(hwnd, text, len(text))
                      rect = wintypes.RECT()
                      if (pid.value in pids and user.IsWindowVisible(hwnd) and text.value == title
                              and user.GetWindowRect(hwnd, ctypes.byref(rect))
                              and rect.right > rect.left and rect.bottom > rect.top):
                          found.append({"id": int(hwnd), "pid": pid.value,
                                        "bounds": [rect.left, rect.top, rect.right, rect.bottom]})
                      return True
                  if not user.EnumWindows(visit, 0):
                      raise ctypes.WinError(ctypes.get_last_error())
                  return found
              if sys.platform == "darwin":
                  import Quartz as q
                  records = q.CGWindowListCopyWindowInfo(
                      q.kCGWindowListOptionOnScreenOnly | q.kCGWindowListExcludeDesktopElements,
                      q.kCGNullWindowID)
                  found = []
                  for record in records or []:
                      bounds = record.get(q.kCGWindowBounds, {})
                      if (record.get(q.kCGWindowOwnerPID) in pids
                              and record.get(q.kCGWindowName) == title
                              and record.get(q.kCGWindowLayer) == 0
                              and bounds.get("Width", 0) > 0 and bounds.get("Height", 0) > 0):
                          found.append({"id": int(record[q.kCGWindowNumber]),
                                        "pid": int(record[q.kCGWindowOwnerPID])})
                  return found
              result = subprocess.run(["xdotool", "search", "--onlyvisible", "--name",
                                       "^" + title + "$"], capture_output=True, text=True, timeout=5)
              found = []
              for window in result.stdout.split():
                  pid = subprocess.run(["xdotool", "getwindowpid", window],
                                       capture_output=True, text=True, timeout=5).stdout.strip()
                  if pid.isdecimal() and int(pid) in pids:
                      found.append({"id": int(window), "pid": int(pid)})
              return found

          try:
              env = os.environ.copy()
              for key in ("PYTHONPATH", "PYTHONHOME", "QT_QPA_PLATFORM", "APPIMAGE_EXTRACT_AND_RUN"):
                  env.pop(key, None)
              if sys.platform == "linux":
                  env["QT_QPA_PLATFORM"] = "xcb"
                  env["QT_DEBUG_PLUGINS"] = "1"
              check_signal()
              started = time.monotonic()
              with (evidence / "gui.log").open("w") as log:
                  process = subprocess.Popen(
                      [os.environ["EXECUTABLE"]], cwd=os.environ["RUNNER_TEMP"], env=env,
                      stdout=log, stderr=subprocess.STDOUT, start_new_session=(os.name != "nt"))
                  owned.add(psutil.Process(process.pid))
                  window = None
                  deadline = started + 90
                  while time.monotonic() < deadline:
                      check_signal()
                      if process.poll() is not None:
                          raise RuntimeError(f"Application exited before GUI: {process.returncode}")
                      candidates = windows(refresh_owned())
                      if candidates:
                          window = candidates[0]
                          break
                      time.sleep(1)
                  appeared = time.monotonic()
                  if window is None or appeared > deadline:
                      raise RuntimeError("Main window not observable within 90s; check desktop permissions and logs")
                  report.update(window=window, window_seconds=round(appeared - started, 3))
                  until = max(started + 30, appeared + 15)
                  while time.monotonic() < until:
                      check_signal()
                      if process.poll() is not None or window["pid"] not in refresh_owned():
                          raise RuntimeError("Application ended during GUI observation")
                      time.sleep(1)
                  visible = windows(refresh_owned())
                  if not any(x["id"] == window["id"] and x["pid"] == window["pid"] for x in visible):
                      raise RuntimeError("Main window disappeared")
                  screenshot = evidence / ("gui.xwd" if sys.platform == "linux" else "gui.png")
                  if sys.platform == "win32":
                      from PIL import ImageGrab
                      ImageGrab.grab(bbox=window["bounds"], all_screens=True).save(screenshot)
                  elif sys.platform == "darwin":
                      subprocess.run(["screencapture", "-x", "-l", str(window["id"]), str(screenshot)],
                                     check=True, timeout=20)
                  else:
                      subprocess.run(["xwd", "-silent", "-id", str(window["id"]), "-out", str(screenshot)],
                                     check=True, timeout=20)
                  if screenshot.stat().st_size == 0:
                      raise RuntimeError("Empty GUI screenshot")
                  check_signal()
                  report["observed_seconds"] = round(time.monotonic() - started, 3)
                  report["passed"] = True
          except BaseException as error:
              report["error"] = str(error)
              raise
          finally:
              try:
                  refresh_owned()
                  # Preserve Process objects so PID reuse cannot target an unrelated process.
                  for method in ("terminate", "kill"):
                      for item in owned:
                          try:
                              getattr(item, method)()
                          except psutil.NoSuchProcess:
                              pass
                      psutil.wait_procs(list(owned), timeout=3)
                      if process is not None:
                          process.poll()
                      if not refresh_owned():
                          break
                  remaining = refresh_owned()
                  report["cleanup_passed"] = not remaining
                  if remaining:
                      raise RuntimeError(f"GUI children survived cleanup: {sorted(remaining)}")
              except BaseException as error:
                  report["passed"] = False
                  report["cleanup_error"] = str(error)
                  raise
              finally:
                  if interrupted is not None:
                      report["passed"] = False
                      report["termination_signal"] = interrupted
                  (evidence / "gui.json").write_text(json.dumps(report, indent=2) + "\n")
          check_signal()
          ''', encoding="utf-8")
      # Install a host graphics driver only in the disposable Windows validation VM.
      # No Mesa DLLs are copied into the ZIP or its extracted application directory.
      - name: Install pinned Mesa software renderer for Windows tests
        if: matrix.enabled && matrix.target == 'exe'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'System-wide Mesa deployment is restricted to disposable GitHub-hosted runners.'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The Windows validation runner must have administrator rights.'
          }
          $packageHash = (Get-FileHash -LiteralPath $env:PACKAGE -Algorithm SHA256).Hash
          $executableHash = (Get-FileHash -LiteralPath $env:EXECUTABLE -Algorithm SHA256).Hash
          if ($packageHash.ToLowerInvariant() -ne $env:EXPECTED_SHA256) {
            throw 'The downloaded Windows ZIP identity changed.'
          }
          $mesaVersion = '26.2.3'
          $mesaHash = '3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          New-Item -ItemType Directory -Path $mesaRoot | Out-Null
          $archive = Join-Path $mesaRoot 'mesa.7z'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mesaHash) {
            throw 'Mesa archive SHA-256 mismatch.'
          }
          & 7z.exe x $archive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa archive extraction failed.' }
          & (Join-Path $mesaRoot 'systemwidedeploy.cmd') 1
          if ($LASTEXITCODE -ne 0) { throw 'Mesa system-wide deployment failed.' }
          if ((Get-FileHash -LiteralPath $env:PACKAGE -Algorithm SHA256).Hash -ne $packageHash -or
              (Get-FileHash -LiteralPath $env:EXECUTABLE -Algorithm SHA256).Hash -ne $executableHash) {
            throw 'Mesa setup unexpectedly changed the application under test.'
          }
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Mesa $mesaVersion, SHA-256: $mesaHash; CI-only system driver." |
            Set-Content -LiteralPath 'evidence/windows-mesa.log' -Encoding utf8

      - name: Require Windows OpenGL for GUI validation
        if: matrix.enabled && matrix.target == 'exe'
        shell: python {0}
        timeout-minutes: 2
        run: |
          import ctypes as c
          from ctypes import wintypes as w
          import json
          import re
          from pathlib import Path

          # Require the CI software driver before starting the unmodified packaged GUI.
          report = {"scope": "runner system WGL context", "measured": False}
          window = dc = context = None
          user = c.WinDLL("user32", use_last_error=True)
          gdi = c.WinDLL("gdi32", use_last_error=True)
          gl = c.WinDLL("opengl32", use_last_error=True)

          class PixelFormat(c.Structure):
              _fields_ = [("nSize", w.WORD), ("nVersion", w.WORD), ("dwFlags", w.DWORD)]
              _fields_ += [(name, w.BYTE) for name in (
                  "iPixelType cColorBits cRedBits cRedShift cGreenBits cGreenShift "
                  "cBlueBits cBlueShift cAlphaBits cAlphaShift cAccumBits cAccumRedBits "
                  "cAccumGreenBits cAccumBlueBits cAccumAlphaBits cDepthBits cStencilBits "
                  "cAuxBuffers iLayerType bReserved").split()]
              _fields_ += [(name, w.DWORD) for name in ("dwLayerMask", "dwVisibleMask", "dwDamageMask")]

          def bind(dll, name, result, arguments):
              fn = getattr(dll, name)
              fn.restype, fn.argtypes = result, arguments
              return fn

          create = bind(user, "CreateWindowExW", w.HWND,
                        [w.DWORD, w.LPCWSTR, w.LPCWSTR, w.DWORD, c.c_int, c.c_int,
                         c.c_int, c.c_int, w.HWND, w.HMENU, w.HINSTANCE, c.c_void_p])
          getdc = bind(user, "GetDC", w.HDC, [w.HWND])
          release = bind(user, "ReleaseDC", c.c_int, [w.HWND, w.HDC])
          destroy = bind(user, "DestroyWindow", w.BOOL, [w.HWND])
          choose = bind(gdi, "ChoosePixelFormat", c.c_int, [w.HDC, c.POINTER(PixelFormat)])
          setformat = bind(gdi, "SetPixelFormat", w.BOOL, [w.HDC, c.c_int, c.POINTER(PixelFormat)])
          createcontext = bind(gl, "wglCreateContext", c.c_void_p, [w.HDC])
          makecurrent = bind(gl, "wglMakeCurrent", w.BOOL, [w.HDC, c.c_void_p])
          deletecontext = bind(gl, "wglDeleteContext", w.BOOL, [c.c_void_p])
          getstring = bind(gl, "glGetString", c.c_char_p, [c.c_uint])
          getproc = bind(gl, "wglGetProcAddress", c.c_void_p, [c.c_char_p])

          def require(value, operation):
              if not value:
                  raise RuntimeError(f"{operation} failed (Win32 error {c.get_last_error()})")
              return value

          try:
              assert c.sizeof(PixelFormat) == 40
              window = require(create(0, "STATIC", "OpenGL diagnostics", 0x80000000,
                                      0, 0, 16, 16, None, None, None, None), "CreateWindowExW")
              dc = require(getdc(window), "GetDC")
              fmt = PixelFormat()
              fmt.nSize, fmt.nVersion = c.sizeof(fmt), 1
              fmt.dwFlags = 0x4 | 0x20 | 0x1  # Draw to window, support OpenGL, double buffer.
              fmt.cColorBits, fmt.cDepthBits, fmt.cStencilBits = 24, 24, 8
              index = require(choose(dc, c.byref(fmt)), "ChoosePixelFormat")
              require(setformat(dc, index, c.byref(fmt)), "SetPixelFormat")
              context = require(createcontext(dc), "wglCreateContext")
              require(makecurrent(dc, context), "wglMakeCurrent")
              for name, token in (("vendor", 0x1F00), ("renderer", 0x1F01), ("version", 0x1F02)):
                  value = require(getstring(token), f"glGetString({name})")
                  report[name] = value.decode("ascii", errors="replace")
              address = getproc(b"wglCreateContextAttribsARB")
              report["has_context_attribs_entrypoint"] = address not in (
                  None, 0, 1, 2, 3, c.c_void_p(-1).value)
              report["measured"] = True
          except Exception as error:
              report["error"] = str(error)
          finally:
              if context:
                  makecurrent(None, None)
                  deletecontext(context)
              if dc:
                  release(window, dc)
              if window:
                  destroy(window)
              Path("evidence").mkdir(exist_ok=True)
              text = json.dumps(report, indent=2)
              Path("evidence/windows-opengl.json").write_text(text + "\n", encoding="utf-8")
              print(text)
          version = re.match(r"(\d+)\.(\d+)", report.get("version", ""))
          if (not report["measured"] or not version
                  or tuple(map(int, version.groups())) < (3, 2)
                  or not report.get("has_context_attribs_entrypoint")):
              raise SystemExit("Runner lacks the OpenGL 3.2 context support required for VTK")
          if "llvmpipe" not in report.get("renderer", "").lower():
              raise SystemExit("Expected the pinned Mesa llvmpipe software renderer")

      - name: Observe real packaged GUI
        id: packaged-gui
        if: matrix.enabled && matrix.target != 'appimage'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a timeout --signal=TERM --kill-after=35s 180s \
              "$VERIFIER" "$RUNNER_TEMP/package-gui-probe.py"
          else
            "$VERIFIER" "$RUNNER_TEMP/package-gui-probe.py"
          fi
      - name: Diagnose Windows GUI crash
        if: always() && matrix.enabled && matrix.target == 'exe' && steps.packaged-gui.outcome == 'failure'
        shell: pwsh
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $reportPath = Join-Path (Get-Location) 'evidence/windows-crash.log'
          "Executable: $env:EXECUTABLE" | Set-Content -LiteralPath $reportPath -Encoding utf8
          "Runner image: $env:ImageOS / $env:ImageVersion" | Add-Content -LiteralPath $reportPath
          try {
            $events = @(Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              Id = 1000, 1001
              StartTime = (Get-Date).AddMinutes(-15)
            } -ErrorAction Stop | Where-Object {
              $_.Message -match '(?i)tractedit\.exe'
            })
            if ($events.Count -eq 0) {
              'No matching application crash events were recorded.' | Add-Content -LiteralPath $reportPath
            }
            foreach ($event in $events) {
              $event | Format-List TimeCreated, Id, ProviderName, Message |
                Out-String -Width 240 | Add-Content -LiteralPath $reportPath
            }
          } catch {
            "Crash events unavailable: $($_.Exception.Message)" | Add-Content -LiteralPath $reportPath
          }
          try {
            Get-CimInstance Win32_VideoController -ErrorAction Stop |
              Select-Object Name, DriverVersion, VideoProcessor, Status |
              Format-List | Out-String -Width 240 | Add-Content -LiteralPath $reportPath
          } catch {
            "Video information unavailable: $($_.Exception.Message)" | Add-Content -LiteralPath $reportPath
          }
          Get-Content -LiteralPath $reportPath

      - name: Detach tested DMG
        if: always() && matrix.enabled && runner.os == 'macOS' && env.DMG_MOUNT != ''
        shell: python {0}
        run: |
          import os
          import subprocess
          subprocess.run(["hdiutil", "detach", os.environ["DMG_MOUNT"]],
                         check=True, timeout=30)
      - name: Report validation diagnostics
        if: always() && matrix.enabled
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          root = Path("evidence")
          reports = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix in (".json", ".log", ".txt", ".network", ".mounts")
          )
          remaining = 64000
          for path in reports:
              if remaining <= 0:
                  break
              limit = min(8000, remaining)
              with path.open("rb") as stream:
                  stream.seek(max(0, path.stat().st_size - limit))
                  tail = stream.read(limit).decode("utf-8", errors="replace")
              print(f"--- {path.as_posix()} (last {limit} bytes at most) ---")
              print(tail)
              remaining -= limit
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Validation diagnostics\n\n")
              summary.write(f"{len(reports)} text reports/logs generated; bounded excerpts are in this step's log.\n\n")
              summary.write("Only application packages are uploaded as artifacts. Screenshots remain temporary runner files.\n")
    env:
      TARGET: ${{ matrix.target }}
