name: Build Releases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS DMG'
        type: boolean
        default: true
      build_appimage:
        description: 'Build Linux AppImage'
        type: boolean
        default: true
      build_deb:
        description: 'Build Linux DEB'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows EXE'
        type: boolean
        default: true

# Release builds run manually via workflow_dispatch; tagging and release uploads are manual.
permissions:
  contents: read

env:
  POETRY_REQUESTS_TIMEOUT: '120'
  POETRY_REQUESTS_MAX_RETRIES: '3'

# ========== Common Test and Distribution Gates ==========
jobs:
  test:
    name: Python 3.11 tests and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/linux/install-apt-dependencies.sh libegl1 libgl1 libxcb-cursor0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install test environment
        env:
          TRACTEDIT_AOT_TARGET_CPU: generic
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'poetry==2.2.1'
          poetry install --with build,dev,test --no-interaction --no-root
          poetry run python _tractedit_build.py

      - name: Run deterministic test suite
        run: poetry run python -m pytest tests -q -p no:cacheprovider

      - name: Check packaging code style
        run: |
          poetry run black --check _tractedit_build.py
          poetry run flake8 _tractedit_build.py --max-line-length=88

  distribution:
    name: Distribution gate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/linux/install-apt-dependencies.sh libegl1 libgl1 libxcb-cursor0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Build wheel from sdist
        shell: bash
        env:
          TRACTEDIT_AOT_TARGET_CPU: generic
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build==1.3.0'
          python -m build --outdir dist

      - name: Validate distribution metadata and contents
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          from packaging.utils import parse_wheel_filename

          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert len(sdists) == 1, sdists
          assert len(wheels) == 1, wheels

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          assert any(name.endswith("/_tractedit_build.py") for name in names)
          assert not any(
              "/tractedit_pkg/_numba_aot/tractedit_numba." in name
              and name.endswith((".pyd", ".so"))
              for name in names
          )

          _, _, _, filename_tags = parse_wheel_filename(wheels[0].name)
          assert not any(
              tag.abi == "none" and tag.platform == "any"
              for tag in filename_tags
          )
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              wheel_files = [n for n in names if n.endswith(".dist-info/WHEEL")]
              record_files = [n for n in names if n.endswith(".dist-info/RECORD")]
              assert len(wheel_files) == len(record_files) == 1
              metadata = archive.read(wheel_files[0]).decode("utf-8")
              assert "Root-Is-Purelib: false" in metadata
              declared_tags = {
                  line.partition(":")[2].strip()
                  for line in metadata.splitlines()
                  if line.startswith("Tag:")
              }
              assert {str(tag) for tag in filename_tags} <= declared_tags
              assert any(
                  name.startswith("tractedit_pkg/_numba_aot/tractedit_numba.")
                  and name.endswith((".pyd", ".so"))
                  for name in names
              )
              for name in names:
                  member = PurePosixPath(name)
                  assert not member.is_absolute() and ".." not in member.parts
              rows = list(
                  csv.reader(
                      io.StringIO(
                          archive.read(record_files[0]).decode("utf-8")
                      )
                  )
              )
              records = {row[0]: row[1:] for row in rows}
              assert set(records) == set(names)
              for name in names:
                  digest_field, size_field = records[name]
                  if name == record_files[0]:
                      assert not digest_field and not size_field
                      continue
                  data = archive.read(name)
                  algorithm, encoded = digest_field.split("=", 1)
                  assert algorithm == "sha256"
                  digest = base64.urlsafe_b64encode(
                      hashlib.sha256(data).digest()
                  ).rstrip(b"=").decode("ascii")
                  assert encoded == digest
                  assert size_field == str(len(data))
          PY

      - name: Create clean wheel environment
        id: wheel-environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "python=$(pwd -P)/.wheel-venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
            echo "cli=$(pwd -P)/.wheel-venv/Scripts/tractedit.exe" >> "$GITHUB_OUTPUT"
          else
            echo "python=$(pwd -P)/.wheel-venv/bin/python" >> "$GITHUB_OUTPUT"
            echo "cli=$(pwd -P)/.wheel-venv/bin/tractedit" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          PYTHON="${{ steps.wheel-environment.outputs.python }}"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --only-binary=:all: dist/*.whl
          "$PYTHON" -m pip check
          export TRACTEDIT_CHECKOUT="$("$PYTHON" -c 'from pathlib import Path; print(Path.cwd().resolve())')"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          PYTHONPATH= PYTHONNOUSERSITE=1 "$PYTHON" -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sysconfig

          import numpy as np

          installed = Path(sysconfig.get_paths()["platlib"]).resolve()
          def installed_origin(name):
              spec = importlib.util.find_spec(name)
              assert spec is not None and spec.origin, name
              origin = Path(spec.origin).resolve()
              assert origin.is_relative_to(installed), (name, origin, installed)
              return origin

          package = installed_origin("tractedit_pkg").parent
          installed_origin("main")
          native = [p for p in package.joinpath("_numba_aot").glob("tractedit_numba.*") if p.suffix in (".pyd", ".so")]
          assert len(native) == 1 and native[0].resolve().is_relative_to(installed), native
          checkout = Path(os.environ["TRACTEDIT_CHECKOUT"]).resolve()
          assert not Path.cwd().resolve().is_relative_to(checkout)
          assert importlib.util.find_spec("numba") is None
          from tractedit_pkg._numba_aot import resample_streamline
          from importlib.resources import files

          assert files("tractedit_pkg").joinpath("assets/logo.png").is_file()
          streamline = np.array([[0.0, 0.0, 0.0], [2.0, 0.0, 0.0]])
          result = resample_streamline(streamline, 3)
          np.testing.assert_array_equal(result[:, 0], [0.0, 1.0, 2.0])
          PY
          PYTHONPATH= PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 "${{ steps.wheel-environment.outputs.cli }}" --version
          PYTHONPATH= PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 "${{ steps.wheel-environment.outputs.cli }}" --help

      - name: Create clean editable environment
        id: editable-environment
        shell: bash
        run: |
          python -m venv .editable-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "python=$(pwd -P)/.editable-venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
            echo "cli=$(pwd -P)/.editable-venv/Scripts/tractedit.exe" >> "$GITHUB_OUTPUT"
          else
            echo "python=$(pwd -P)/.editable-venv/bin/python" >> "$GITHUB_OUTPUT"
            echo "cli=$(pwd -P)/.editable-venv/bin/tractedit" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and smoke-test editable source
        shell: bash
        env:
          TRACTEDIT_AOT_TARGET_CPU: generic
        run: |
          PYTHON="${{ steps.editable-environment.outputs.python }}"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --editable .
          "$PYTHON" -m pip check
          export TRACTEDIT_CHECKOUT="$("$PYTHON" -c 'from pathlib import Path; print(Path.cwd().resolve())')"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          PYTHONPATH= PYTHONNOUSERSITE=1 "$PYTHON" -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          import numpy as np

          checkout = Path(os.environ["TRACTEDIT_CHECKOUT"]).resolve()
          assert not Path.cwd().resolve().is_relative_to(checkout)
          def editable_origin(name):
              spec = importlib.util.find_spec(name)
              assert spec is not None and spec.origin, name
              origin = Path(spec.origin).resolve()
              assert origin.is_relative_to(checkout), (name, origin, checkout)
              return origin

          package = editable_origin("tractedit_pkg").parent
          editable_origin("main")
          native = [p for p in package.joinpath("_numba_aot").glob("tractedit_numba.*") if p.suffix in (".pyd", ".so")]
          assert len(native) == 1 and native[0].resolve().is_relative_to(checkout), native
          assert importlib.util.find_spec("numba") is None
          from tractedit_pkg._numba_aot import resample_streamline
          from importlib.resources import files

          assert files("tractedit_pkg").joinpath("assets/logo.png").is_file()
          streamline = np.array([[0.0, 0.0, 0.0], [2.0, 0.0, 0.0]])
          result = resample_streamline(streamline, 3)
          np.testing.assert_array_equal(result[:, 0], [0.0, 1.0, 2.0])
          PY
          PYTHONPATH= PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 "${{ steps.editable-environment.outputs.cli }}" --version
          PYTHONPATH= PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 "${{ steps.editable-environment.outputs.cli }}" --help

  # ========== Four-Target Build Matrix ==========
  build:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - test
      - distribution
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: dmg
            name: macOS DMG
            artifact_name: TractEdit-macOS-arm64
          - os: ubuntu-22.04
            target: appimage
            name: Linux AppImage
            artifact_name: TractEdit-Linux-AppImage
          - os: ubuntu-24.04
            target: deb
            name: Linux DEB
            artifact_name: TractEdit-Linux-DEB
          - os: windows-latest
            target: exe
            name: Windows EXE
            artifact_name: TractEdit-Windows-x64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    
    steps:
      # Determine if this build should run based on manual trigger inputs
      - name: Check if build is enabled
        id: check
        shell: bash
        run: |
          # Check the relevant workflow_dispatch input
          case "${{ matrix.target }}" in
            dmg)
              echo "should_build=${{ github.event.inputs.build_macos }}" >> $GITHUB_OUTPUT
              ;;
            appimage)
              echo "should_build=${{ github.event.inputs.build_appimage }}" >> $GITHUB_OUTPUT
              ;;
            deb)
              echo "should_build=${{ github.event.inputs.build_deb }}" >> $GITHUB_OUTPUT
              ;;
            exe)
              echo "should_build=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "should_build=true" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Skip notification
        if: steps.check.outputs.should_build != 'true'
        run: echo "⏭️ Skipping ${{ matrix.name }} build (disabled in workflow inputs)"

      - name: Checkout code
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Get version from pyproject.toml (Unix)
        if: steps.check.outputs.should_build == 'true' && runner.os != 'Windows'
        id: version-unix
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get version from pyproject.toml (Windows)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Windows'
        id: version-windows
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml
          $version = ($content | Select-String -Pattern 'version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Set version output
        if: steps.check.outputs.should_build == 'true'
        id: version
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "VERSION=${{ steps.version-windows.outputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ steps.version-unix.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi

      # ========== Target-Specific Host Setup ==========
      - name: Install Linux system dependencies
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'deb'
        run: |
          bash .github/scripts/linux/install-apt-dependencies.sh \
            libgl1-mesa-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1 \
            fuse \
            imagemagick

      - name: Install AppImage system dependencies (Jammy)
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        run: |
          bash .github/scripts/linux/install-apt-dependencies.sh libgl1-mesa-dev libxcb-xinerama0 \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 imagemagick binutils file \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgtk-3-0 \
            libwayland-cursor0 libwayland-egl1

      # ========== Python Tools and Common AOT Compilation ==========
      - name: Install Poetry
        if: steps.check.outputs.should_build == 'true' && matrix.target != 'appimage'
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.2.1

      - name: Install Python dependencies
        if: steps.check.outputs.should_build == 'true' && matrix.target != 'appimage'
        run: |
          poetry install --with build --no-interaction --no-root
          poetry run pip install pyinstaller==6.16.0 pyinstaller-hooks-contrib==2025.9

      - name: Install AppImage Python build tools and locked dependencies
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        run: |
          python -m pip install 'poetry==2.2.1'
          poetry install --with build --no-interaction --no-root
          poetry run python -m pip install 'pyinstaller==6.16.0' 'pyinstaller-hooks-contrib==2025.9'

      - name: Build AOT numerical extension
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        env:
          TRACTEDIT_AOT_TARGET_CPU: generic
        run: |
          poetry run python tractedit_pkg/_numba_aot/build_aot.py
          # Verify the compiled module exists
          python -c "import glob, sys; files = glob.glob('tractedit_pkg/_numba_aot/tractedit_numba.*'); print(f'AOT module: {files}'); sys.exit(0 if files else 1)"

      # ========== PyInstaller Builds ==========
      - name: Build with PyInstaller (Linux)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        run: |
          poetry run pyinstaller .github/scripts/linux/tractedit.spec --noconfirm

      - name: Build with PyInstaller (macOS)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'macOS'
        run: |
          poetry run pyinstaller .github/scripts/macos/tractedit.spec --noconfirm

      - name: Build with PyInstaller (Windows)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Windows'
        run: |
          poetry run pyinstaller .github/scripts/windows/tractedit.spec --noconfirm

      # ========== PyInstaller Application Verification ==========
      - name: Smoke-test PyInstaller application (Linux)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        run: dist/tractedit/tractedit --version

      - name: Smoke-test PyInstaller application (macOS)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'macOS'
        run: dist/TractEdit.app/Contents/MacOS/TractEdit --version

      - name: Smoke-test PyInstaller application (Windows)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist\TractEdit\TractEdit.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ========== macOS DMG Packaging ==========
      - name: Create DMG
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'dmg'
        run: |
          brew install create-dmg
          
          create-dmg \
            --volname "TractEdit" \
            --window-size 600 400 \
            --icon-size 100 \
            --text-size 14 \
            --icon "TractEdit.app" 150 190 \
            --app-drop-link 450 190 \
            "TractEdit-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg" \
            "dist/TractEdit.app"

      - name: Prepare Linux document icons
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        run: |
          mkdir -p build/document-icons
          for type in trk trx tck vtk vtp nifti tractedit-session; do
            ln -sfn ../apps/tractedit.png "build/document-icons/application-x-$type.png"
          done

      # ========== Linux AppImage Packaging ==========
      - name: Download appimagetool
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/appimage-tools
          cd build/appimage-tools
          curl --fail --location --retry 3 -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage' | sha256sum --check
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64' | sha256sum --check
          chmod +x appimagetool.AppImage
          # Extract only the build tool; final-artifact mount tests are separate.
          ./appimagetool.AppImage --appimage-extract > /dev/null
          # The selected musl runtime must have no interpreter or dynamic dependencies.
          readelf -lW runtime-x86_64 > runtime-program-headers.txt
          readelf -dW runtime-x86_64 > runtime-dynamic.txt
          if grep -q INTERP runtime-program-headers.txt; then
            echo '::error::Downloaded AppImage runtime has PT_INTERP'
            exit 1
          fi
          if grep -q NEEDED runtime-dynamic.txt; then
            echo '::error::Downloaded AppImage runtime has DT_NEEDED'
            exit 1
          fi

      - name: Build AppImage
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        shell: bash
        env:
          APPIMAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          VERSION="$APPIMAGE_VERSION"
          APPDIR="build/TractEdit.AppDir"
          
          # Create AppDir structure
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/48x48/apps"
          mkdir -p "$APPDIR/usr/share/metainfo"
          
          # Copy PyInstaller output
          cp -r "dist/tractedit/"* "$APPDIR/usr/bin/"

          # The shared spec retains the PDF image plugin but excludes its Qt
          # library. Complete this AppImage's existing plugin dependency only;
          # use the installed, locked Qt wheel without changing the shared spec.
          poetry run python - <<'PY'
          from pathlib import Path
          import shutil
          from PyQt6.QtCore import QLibraryInfo

          internal = Path("build/TractEdit.AppDir/usr/bin/_internal")
          if (internal / "PyQt6/Qt6/plugins/imageformats/libqpdf.so").exists():
              qt_lib = Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.LibrariesPath))
              shutil.copy2(qt_lib / "libQt6Pdf.so.6", internal / "libQt6Pdf.so.6")
          # PyInstaller treats these as host libraries (the shared spec also
          # excludes JPEG). Retain the three observed Qt/GTK dependencies in
          # this AppImage so a minimal Noble host resolves every shipped ELF.
          for name in ("libjpeg.so.8", "libwayland-cursor.so.0", "libwayland-egl.so.1"):
              shutil.copy2(Path("/usr/lib/x86_64-linux-gnu") / name, internal / name)
          # Jammy's bundled C++ runtime shadows Noble's newer Mesa/LLVM
          # requirement (GLIBCXX_3.4.32), aborting VTK initialization. Use the
          # host C++ runtime on both supported Ubuntu versions; the final ELF
          # gate verifies all application GLIBCXX/CXXABI needs on each host.
          for path in internal.rglob("libstdc++.so*"):
              path.unlink()
          PY
          
          # Copy desktop file and appdata
          cp ".github/scripts/linux/tractedit.desktop" "$APPDIR/usr/share/applications/"
          cp ".github/scripts/linux/tractedit.desktop" "$APPDIR/"
          install -Dm644 .github/scripts/linux/tractedit-mime.xml "$APPDIR/usr/share/mime/packages/tractedit-mime.xml"
          cp tractedit_pkg/linux_appimage_integration.py "$APPDIR/register-appimage.py"
          cp ".github/scripts/linux/io.github.tractedit.appdata.xml" "$APPDIR/usr/share/metainfo/"
          
          # Copy and resize icons
          cp "tractedit_pkg/assets/tractedit.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/tractedit.png"
          cp -a build/document-icons "$APPDIR/usr/share/icons/hicolor/256x256/mimetypes"
          convert "tractedit_pkg/assets/tractedit.png" -resize 128x128 "$APPDIR/usr/share/icons/hicolor/128x128/apps/tractedit.png"
          convert "tractedit_pkg/assets/tractedit.png" -resize 64x64 "$APPDIR/usr/share/icons/hicolor/64x64/apps/tractedit.png"
          convert "tractedit_pkg/assets/tractedit.png" -resize 48x48 "$APPDIR/usr/share/icons/hicolor/48x48/apps/tractedit.png"
          
          # Icon in AppDir root
          cp "tractedit_pkg/assets/tractedit.png" "$APPDIR/tractedit.png"
          ln -sf tractedit.png "$APPDIR/.DirIcon"
          
          # Create AppRun script
          cat > "$APPDIR/AppRun" << 'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          if [ "$#" -eq 1 ] && [ "$1" = "--register-file-types" ]; then
              if command -v python3 >/dev/null 2>&1; then
                  exec python3 "$HERE/register-appimage.py" "$HERE"
              fi
              exec "${HERE}/usr/bin/tractedit" --register-file-types
          fi
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          export GIO_LAUNCHED_DESKTOP_FILE="${HERE}/tractedit.desktop"
          export GIO_LAUNCHED_DESKTOP_FILE_PID=$$
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          export RESOURCE_NAME=tractedit
          
          is_ubuntu_wayland() {
              if [ -f /etc/os-release ]; then
                  . /etc/os-release
                  if [[ "$ID" == "ubuntu" ]] || [[ "$ID_LIKE" == *"ubuntu"* ]]; then
                      if [ -n "$WAYLAND_DISPLAY" ] || [ "$XDG_SESSION_TYPE" = "wayland" ]; then
                          return 0
                      fi
                  fi
              fi
              return 1
          }
          
          if is_ubuntu_wayland; then
              export QT_QPA_PLATFORM=xcb
              exec "${HERE}/usr/bin/tractedit" "$@"
          fi
          
          for arg in "$@"; do
              case "$arg" in
                  --) break ;;
                  --convert-to|--convert-to=*|--density-map|--density-map=*|-h|--help|-V|-v|--version)
                      exec "${HERE}/usr/bin/tractedit" "$@" ;;
              esac
          done
          "${HERE}/usr/bin/tractedit" "$@"
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
              if [ -n "$WAYLAND_DISPLAY" ] || [ "$XDG_SESSION_TYPE" = "wayland" ]; then
                  echo "Note: Falling back to XCB platform for Wayland compatibility..."
                  export QT_QPA_PLATFORM=xcb
                  exec "${HERE}/usr/bin/tractedit" "$@"
              else
                  exit $EXIT_CODE
              fi
          fi
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"
          
          # Build AppImage
          cd build
          ARCH=x86_64 appimage-tools/squashfs-root/AppRun \
            --runtime-file appimage-tools/runtime-x86_64 \
            "TractEdit.AppDir" "../dist/TractEdit-$VERSION-x86_64.AppImage"

      # ========== Linux DEB Packaging ==========
      - name: Build DEB package
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'deb'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACKAGE_NAME="TractEdit"
          DEB_DIR="build/${PACKAGE_NAME}_${VERSION}_amd64"
          
          # Create Debian package structure
          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/opt/tractedit"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/48x48/apps"
          
          # Copy application files to /opt
          cp -r "dist/tractedit/"* "$DEB_DIR/opt/tractedit/"
          
          # Create launcher script in /usr/bin
          cat > "$DEB_DIR/usr/bin/tractedit" << 'LAUNCHER_EOF'
          #!/bin/bash
          
          is_ubuntu_wayland() {
              if [ -f /etc/os-release ]; then
                  . /etc/os-release
                  if [[ "$ID" == "ubuntu" ]] || [[ "$ID_LIKE" == *"ubuntu"* ]]; then
                      if [ -n "$WAYLAND_DISPLAY" ] || [ "$XDG_SESSION_TYPE" = "wayland" ]; then
                          return 0
                      fi
                  fi
              fi
              return 1
          }
          
          if is_ubuntu_wayland; then
              export QT_QPA_PLATFORM=xcb
              exec /opt/tractedit/tractedit "$@"
          fi
          
          for arg in "$@"; do
              case "$arg" in
                  --) break ;;
                  --convert-to|--convert-to=*|--density-map|--density-map=*|-h|--help|-V|-v|--version)
                      exec /opt/tractedit/tractedit "$@" ;;
              esac
          done
          /opt/tractedit/tractedit "$@"
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
              if [ -n "$WAYLAND_DISPLAY" ] || [ "$XDG_SESSION_TYPE" = "wayland" ]; then
                  export QT_QPA_PLATFORM=xcb
                  exec /opt/tractedit/tractedit "$@"
              else
                  exit $EXIT_CODE
              fi
          fi
          LAUNCHER_EOF
          chmod +x "$DEB_DIR/usr/bin/tractedit"
          
          # Copy desktop file
          cp ".github/scripts/linux/tractedit.desktop" "$DEB_DIR/usr/share/applications/"
          install -Dm644 .github/scripts/linux/tractedit-mime.xml "$DEB_DIR/usr/share/mime/packages/tractedit-mime.xml"
          
          # Copy and resize icons
          cp "tractedit_pkg/assets/tractedit.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/"
          cp -a build/document-icons "$DEB_DIR/usr/share/icons/hicolor/256x256/mimetypes"
          convert "tractedit_pkg/assets/tractedit.png" -resize 128x128 "$DEB_DIR/usr/share/icons/hicolor/128x128/apps/tractedit.png"
          convert "tractedit_pkg/assets/tractedit.png" -resize 64x64 "$DEB_DIR/usr/share/icons/hicolor/64x64/apps/tractedit.png"
          convert "tractedit_pkg/assets/tractedit.png" -resize 48x48 "$DEB_DIR/usr/share/icons/hicolor/48x48/apps/tractedit.png"
          
          # Create DEBIAN control file
          cat > "$DEB_DIR/DEBIAN/control" << CONTROL_EOF
          Package: tractedit
          Version: $VERSION
          Section: science
          Priority: optional
          Architecture: amd64
          Depends: shared-mime-info
          Maintainer: Marco Tagliaferri <marco.tagliaferri@unitn.it>
          Description: Interactive tractography bundle editor
           TractEdit is a Python-based graphical interface for interactively
           viewing, selecting, and editing tractography bundles in .trk, .tck
           and .trx formats.
          Homepage: https://github.com/marcotag93/TractEdit
          CONTROL_EOF
          
          # Create postinst script
          cat > "$DEB_DIR/DEBIAN/postinst" << 'POSTINST_EOF'
          #!/bin/bash
          if [ -x /usr/bin/update-icon-caches ]; then
              /usr/bin/update-icon-caches /usr/share/icons/hicolor || true
          fi
          if [ -x /usr/bin/update-desktop-database ]; then
              /usr/bin/update-desktop-database /usr/share/applications || true
          fi
          POSTINST_EOF
          chmod +x "$DEB_DIR/DEBIAN/postinst"
          
          # Build .deb package
          cd build
          dpkg-deb --build --root-owner-group "${PACKAGE_NAME}_${VERSION}_amd64"
          mv "${PACKAGE_NAME}_${VERSION}_amd64.deb" "../dist/"

      # ========== Windows EXE and ZIP Packaging ==========
      - name: Create Windows ZIP
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'exe'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\TractEdit -DestinationPath "TractEdit-${{ steps.version.outputs.VERSION }}-windows-x64.zip"

      # ========== Packaged Artifact Verification ==========
      - name: Verify DMG artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'dmg'
        run: hdiutil verify "TractEdit-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg"

      - name: Smoke-test AppImage artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          image="dist/TractEdit-${APPIMAGE_VERSION}-x86_64.AppImage"
          test -f "$image"
          dist/TractEdit-${APPIMAGE_VERSION}-x86_64.AppImage --version
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          image = Path("dist") / f"TractEdit-{os.environ['APPIMAGE_VERSION']}-x86_64.AppImage"
          images = list(Path("dist").glob("*.AppImage"))
          if images != [image]:
              raise SystemExit(f"Expected exactly {image}, found {images}")
          with image.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "build_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "version": os.environ["APPIMAGE_VERSION"],
              "filename": image.name,
              "size_bytes": image.stat().st_size,
              "appimage_sha256": digest,
              "workflow_sha256": hashlib.sha256(
                  Path(".github/workflows/build-releases.yml").read_bytes()
              ).hexdigest(),
              "appimagetool_version": "1.9.1",
              "appimagetool_sha256": "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0",
              "runtime_version": "20251108",
              "runtime_sha256": "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d",
              "runtime_option": "--runtime-file appimage-tools/runtime-x86_64",
          }
          Path("dist/AppImage.sha256").write_text(f"{digest}  {image.name}\n")
          Path("dist/AppImage-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Smoke-test DEB payload
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'deb'
        run: |
          mkdir -p build/deb-smoke
          dpkg-deb --extract "dist/TractEdit_${{ steps.version.outputs.VERSION }}_amd64.deb" build/deb-smoke
          entry=build/deb-smoke/usr/share/applications/tractedit.desktop
          grep -Fx 'Exec=tractedit %f' "$entry"
          grep -Eq '^MimeType=([^;]+;)*model/obj(;|$)' "$entry"
          cmp .github/scripts/linux/tractedit-mime.xml build/deb-smoke/usr/share/mime/packages/tractedit-mime.xml
          build/deb-smoke/opt/tractedit/tractedit --version

      - name: Smoke-test Windows ZIP payload
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'exe'
        shell: pwsh
        run: |
          Expand-Archive "TractEdit-${{ steps.version.outputs.VERSION }}-windows-x64.zip" -DestinationPath build\zip-smoke
          & build\zip-smoke\TractEdit\TractEdit.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ========== Distribution Artifact Collection ==========
      - name: Upload DMG artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'dmg'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: TractEdit-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'appimage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/TractEdit-*.AppImage
            dist/AppImage.sha256
            dist/AppImage-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload DEB artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'deb'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/TractEdit_*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifact
        if: steps.check.outputs.should_build == 'true' && matrix.target == 'exe'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: TractEdit-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # AppImage-only continuation: both host matrices must pass before manual release.
  # Downloadable build artifacts alone do not indicate that these checks passed.
  # ========== AppImage Compatibility on Ubuntu 22.04 and 24.04 ==========
  appimage-compatibility:
    name: AppImage ABI and desktop (${{ matrix.os }})
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.build_appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout workflow for provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11 for verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download the single AppImage build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TractEdit-Linux-AppImage
          path: artifact

      - name: Verify AppImage identity and provenance
        id: identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          folder = Path("artifact")
          manifest = json.loads((folder / "AppImage-manifest.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          expected = f"TractEdit-{version}-x86_64.AppImage"
          images = list(folder.glob("*.AppImage"))
          if len(images) != 1 or images[0].name != expected:
              raise SystemExit(f"Expected only {expected}; found {images}")
          image = images[0]
          with image.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          workflow_digest = hashlib.sha256(
              Path(".github/workflows/build-releases.yml").read_bytes()
          ).hexdigest()
          checks = {
              "commit": os.environ["EXPECTED_COMMIT"],
              "run_id": os.environ["EXPECTED_RUN_ID"],
              "version": version,
              "filename": expected,
              "size_bytes": image.stat().st_size,
              "appimage_sha256": digest,
              "workflow_sha256": workflow_digest,
              "appimagetool_version": "1.9.1",
              "appimagetool_sha256": "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0",
              "runtime_version": "20251108",
              "runtime_sha256": "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d",
              "runtime_option": "--runtime-file appimage-tools/runtime-x86_64",
          }
          if any(manifest.get(key) != value for key, value in checks.items()):
              raise SystemExit(f"AppImage manifest mismatch: {checks} != {manifest}")
          if not re.fullmatch(r"[1-9]\d*", str(manifest.get("build_attempt", ""))):
              raise SystemExit("Invalid build attempt")
          if (folder / "AppImage.sha256").read_text() != f"{digest}  {expected}\n":
              raise SystemExit("AppImage.sha256 mismatch")
          Path("evidence/identity.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image.resolve()}\nsha256={digest}\n")
          print(f"Verified {expected}: {digest}")
          PY

      - name: Prepare FUSE3 and desktop host without libfuse2
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/linux/install-apt-dependencies.sh xvfb xauth xdotool x11-apps firejail binutils fuse3 desktop-file-utils shared-mime-info libglib2.0-bin \
            libgl1 libegl1 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
          for package in libfuse2 libfuse2t64; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            printf '%s %s\n' "$package" "$status" >> evidence/fuse-packages-before.txt
            if [[ "$status" == 'install ok installed' ]]; then
              sudo apt-get purge -y "$package"
            fi
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            printf '%s %s\n' "$package" "$status" >> evidence/fuse-packages-after.txt
            if [[ "$status" == 'install ok installed' ]]; then
              echo "::error::$package remains installed"
              exit 1
            fi
          done
          if ! ldconfig -p > evidence/ldconfig.txt 2> evidence/ldconfig.stderr; then
            echo '::error::ldconfig failed'
            exit 1
          fi
          if grep -F 'libfuse.so.2' evidence/ldconfig.txt; then
            echo '::error::libfuse.so.2 is still available'
            exit 1
          fi
          test -c /dev/fuse
          command -v fusermount3 > evidence/fusermount3-path.txt
          fusermount3 -V > evidence/fusermount3-version.txt
          firejail --version > evidence/firejail-version.txt
          printf '%s\n' \
            'Catalog source: https://github.com/AppImage/appimage.github.io/blob/master/code/worker.sh' \
            'Catalog worker observed on 2026-09-28: Alpine Firejail git20230825, direct --appimage launch, up to 30 seconds for a window.' \
            'This job records the installed Ubuntu Firejail version and configuration separately.' \
            > evidence/catalog-reference.txt
          if [[ -f /etc/firejail/firejail.config ]]; then
            cp /etc/firejail/firejail.config evidence/firejail.config
          fi
          cat /etc/os-release > evidence/os-release.txt
          dpkg-query -W > evidence/packages.txt
          printf 'FUSE3 helper and device available; live mount is checked in GUI probes.\n' \
            > evidence/fuse-check.txt

      - name: Audit final runtime and every payload ELF
        id: abi-audit
        shell: bash
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          chmod +x "$IMAGE"
          cd artifact
          timeout 120s "$IMAGE" --appimage-extract > ../evidence/extract.log 2>&1
          cd ..
          data=$(mktemp -d)
          probe_image="$data/TractEdit 100%.AppImage"
          ln "$IMAGE" "$probe_image" || cp --reflink=auto "$IMAGE" "$probe_image"
          XDG_DATA_HOME="$data" "$probe_image" --register-file-types
          entry="$data/applications/tractedit-appimage.desktop"
          desktop-file-validate "$entry"
          grep '^Exec=' "$entry" | grep -F 'TractEdit 100%%.AppImage" %f'
          grep -Fx "TryExec=$probe_image" "$entry"
          grep -Eq '^MimeType=([^;]+;)*model/obj(;|$)' "$entry"
          cmp .github/scripts/linux/tractedit-mime.xml "$data/mime/packages/tractedit-mime.xml"
          test -s "$data/mime/mime.cache"
          grep -q 'tractedit-appimage.desktop' "$data/applications/mimeinfo.cache"
          probe_files=$(mktemp -d)
          python3 - "$probe_files" <<'PY'
          import gzip
          from pathlib import Path
          import sys

          folder = Path(sys.argv[1])
          raw = b"nifti-probe"
          compressed = gzip.compress(raw)
          (folder / "Anatomia è.nii").write_bytes(raw)
          (folder / "Anatomia è.NII.GZ").write_bytes(compressed)
          (folder / "archive.gz").write_bytes(compressed)
          (folder / "bundle.trk").write_bytes(b"TRACK")
          (folder / "mesh.obj").write_text("v 0 0 0\n")
          PY
          check_type() {
            local actual
            actual=$(XDG_DATA_HOME="$data" gio info -a standard::content-type "$probe_files/$1" |
              sed -n 's/^  standard::content-type: //p')
            if [[ "$actual" != "$2" ]]; then
              printf '::error::%s has MIME type %s, expected %s\n' "$1" "$actual" "$2"
              return 1
            fi
            printf '%s: %s\n' "$1" "$actual"
          }
          check_type "Anatomia è.nii" application/x-nifti
          check_type "Anatomia è.NII.GZ" application/x-nifti-gzip
          check_type archive.gz application/gzip
          check_type bundle.trk application/x-trk
          check_type mesh.obj model/obj
          for type in application/x-nifti application/x-nifti-gzip; do
            XDG_DATA_HOME="$data" gio mime "$type" | grep -F 'tractedit-appimage.desktop'
          done
          appdir="$PWD/artifact/squashfs-root"
          mkdir "$probe_files/bin"
          for tool in readlink update-mime-database update-desktop-database; do
            ln -s "$(command -v "$tool")" "$probe_files/bin/$tool"
          done
          APPIMAGE="$probe_image" APPDIR="$appdir" XDG_DATA_HOME="$probe_files/data" \
            PATH="$probe_files/bin" "$appdir/AppRun" --register-file-types
          cmp "$entry" "$probe_files/data/applications/tractedit-appimage.desktop"
          rm -rf "$probe_files" "$data"
          python3 - <<'PY'
          """Audit the final AppImage ELF and every distinct extracted ELF."""

          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          image = Path(os.environ["IMAGE"]).resolve()
          payload = Path("artifact/squashfs-root").resolve()
          report = {
              "image": str(image),
              "payload_root": str(payload),
              "loader_diagnostic_path": "PyInstaller _internal plus each ELF directory",
              "runtime": None,
              "elf_count": 0,
              "symlink_count": 0,
              "payload": [],
              "failures": [],
          }

          def inspect(path):
              def readelf(flag):
                  return subprocess.check_output(
                      ["readelf", flag, str(path)], text=True,
                      env={**os.environ, "LC_ALL": "C"}
                  )
              needs = readelf("-VW").partition("Version needs section")[2]
              return {
                  "path": str(path),
                  "x86_64": "Advanced Micro Devices X86-64" in readelf("-hW"),
                  "requirements": sorted(set(re.findall(
                      r"Name: ((?:GLIBC|GLIBCXX|CXXABI)_[\w.]+)", needs
                  ))),
                  "needed": re.findall(r"\(NEEDED\).*?\[(.*?)\]", readelf("-dW")),
                  "interpreter": "INTERP" in readelf("-lW"),
              }

          def fail(message):
              report["failures"].append(message)

          try:
              runtime = inspect(image)
              report["runtime"] = runtime
              if not runtime["x86_64"]:
                  fail("AppImage runtime is not x86_64")
              if runtime["interpreter"] or runtime["needed"] or runtime["requirements"]:
                  fail("AppImage runtime is not static")
              if not payload.is_dir():
                  fail("AppImage extraction did not create a payload")
              else:
                  for path in sorted(payload.rglob("*")):
                      if not path.is_symlink():
                          continue
                      report["symlink_count"] += 1
                      try:
                          target = path.resolve(strict=True)
                      except (OSError, RuntimeError):
                          fail(f"{path}: broken or cyclic symlink")
                          continue
                      if not target.is_relative_to(payload):
                          fail(f"{path}: symlink escapes AppDir")
                  for path in sorted(payload.rglob("*")):
                      if not path.is_file() or path.is_symlink():
                          continue
                      with path.open("rb") as stream:
                          if stream.read(4) != b"\x7fELF":
                              continue
                      try:
                          record = inspect(path)
                          if not record["x86_64"]:
                              fail(f"{path}: not x86_64")
                          for version in record["requirements"]:
                              if version.startswith("GLIBC_"):
                                  value = version.removeprefix("GLIBC_")
                                  if not re.fullmatch(r"\d+(?:\.\d+)*", value) or tuple(
                                      map(int, value.split("."))
                                  ) > (2, 35):
                                      fail(f"{path}: unsupported {version}")
                          internal = payload / "usr/bin/_internal"
                          env = {**os.environ, "LC_ALL": "C",
                                 "LD_LIBRARY_PATH": f"{internal}:{path.parent}"}
                          result = subprocess.run(
                              ["ldd", "-v", str(path)], env=env,
                              text=True, capture_output=True, timeout=30
                          )
                          loader = result.stdout + result.stderr
                          record["loader"] = loader
                          record["resolved_paths"] = sorted(set(re.findall(
                              r"=>\s+(/\S+)", loader
                          )))
                          if "not found" in loader:
                              fail(f"{path}: unresolved library or symbol version")
                          if result.returncode and not any(
                              phrase in loader for phrase in (
                                  "not a dynamic executable", "statically linked"
                              )
                          ):
                              fail(f"{path}: ldd failed ({result.returncode})")
                          report["payload"].append(record)
                          report["elf_count"] += 1
                      except Exception as error:
                          fail(f"{path}: audit failed: {error}")
                  if report["elf_count"] == 0:
                      fail("No payload ELF files found")
          except Exception as error:
              fail(f"Runtime audit failed: {error}")
          finally:
              Path("evidence/elf-audit.json").write_text(
                  json.dumps(report, indent=2) + "\n", encoding="utf-8"
              )
          print(f"{report['elf_count']} payload ELFs, {len(report['failures'])} failures")
          for failure in report["failures"]:
              print(failure)
          raise SystemExit(bool(report["failures"]))
          PY

      - name: Prepare bounded GUI probe supervisor
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/appimage-gui-probe.py" <<'PY'
          """Observe the real GUI process, FUSE mount, and sandbox network."""

          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          mode = sys.argv[1]
          image = str(Path(os.environ["IMAGE"]).resolve())
          evidence = Path(os.environ["GITHUB_WORKSPACE"]) / "evidence"
          report = {"mode": mode, "image": image, "passed": False}
          log = evidence / f"{mode}.log"
          process = None
          termination_signal = None

          def request_termination(signum, frame):
              # Defer the exception until Popen has returned and its PID is owned.
              global termination_signal
              termination_signal = signum

          def check_termination():
              if termination_signal is not None:
                  raise RuntimeError(f"Probe interrupted by signal {termination_signal}")

          signal.signal(signal.SIGTERM, request_termination)
          signal.signal(signal.SIGINT, request_termination)

          def live_group_members(group):
              members = []
              for entry in Path("/proc").iterdir():
                  if not entry.name.isdecimal():
                      continue
                  try:
                      # comm may contain spaces or parentheses; fields follow its last ')'.
                      fields = (entry / "stat").read_text().rsplit(")", 1)[1].split()
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if int(fields[2]) == group and fields[0] not in ("Z", "X"):
                      members.append(int(entry.name))
              return members

          def stop_application():
              if process is None:
                  return
              # Check the whole group even when the launcher has already exited.
              for signum, grace in ((signal.SIGTERM, 3), (signal.SIGKILL, 2)):
                  try:
                      os.killpg(process.pid, signum)
                  except ProcessLookupError:
                      pass
                  deadline = time.monotonic() + grace
                  while time.monotonic() < deadline:
                      process.poll()  # Reap the launcher if it has terminated.
                      if not live_group_members(process.pid):
                          process.wait(timeout=1)
                          report["cleanup_passed"] = True
                          return
                      time.sleep(0.1)
              report["remaining_pids"] = live_group_members(process.pid)
              raise RuntimeError("Application process group survived cleanup")

          def child_of(pid, ancestor):
              seen = set()
              while pid > 1 and pid not in seen:
                  if pid == ancestor:
                      return True
                  seen.add(pid)
                  try:
                      status = Path(f"/proc/{pid}/status").read_text()
                      pid = int(next(
                          line.split()[1] for line in status.splitlines()
                          if line.startswith("PPid:")
                      ))
                  except (OSError, StopIteration, ValueError):
                      break
              return False

          def owning_host_pid(reported_pid, launcher_pid):
              # X11 can report a PID inside Firejail's PID namespace. Map its
              # NSpid to the host and still require launcher ancestry or group.
              candidates = [reported_pid]
              for entry in Path("/proc").iterdir():
                  if not entry.name.isdecimal() or int(entry.name) == reported_pid:
                      continue
                  try:
                      status = (entry / "status").read_text()
                      nested = next(
                          line.split()[1:] for line in status.splitlines()
                          if line.startswith("NSpid:")
                      )
                  except (OSError, StopIteration):
                      continue
                  if nested and int(nested[-1]) == reported_pid:
                      candidates.append(int(entry.name))
              for pid in candidates:
                  try:
                      group = os.getpgid(pid)
                      executable = os.readlink(f"/proc/{pid}/exe")
                      cmdline = Path(f"/proc/{pid}/cmdline").read_bytes()
                  except (OSError, ProcessLookupError):
                      continue
                  if (group == launcher_pid or child_of(pid, launcher_pid)) and (
                      "tractedit" in executable.lower()
                      or b"tractedit" in cmdline.lower()
                  ):
                      return pid
              return None

          try:
              (evidence / f"{mode}.pass").unlink(missing_ok=True)
              check_termination()
              env = os.environ.copy()
              for name in ("APPIMAGE_EXTRACT_AND_RUN",
                           "APPIMAGE_EXTRACT_AND_RUN_NO_CLEANUP", "QT_QPA_PLATFORM"):
                  env.pop(name, None)
              if mode.endswith("extract"):
                  env["APPIMAGE_EXTRACT_AND_RUN"] = "1"
              if mode != "plain-mount":
                  env["QT_QPA_PLATFORM"] = "xcb"
              if mode.startswith("plain"):
                  command = [image]
              elif mode == "catalog":
                  # Current catalog worker.sh launches Firejail directly with --appimage.
                  command = ["firejail", "--quiet", "--noprofile",
                             "--net=none", "--appimage", image]
              else:
                  command = ["firejail", "--noprofile", "--net=none", image]
              report["command"] = command
              report["qt_platform"] = env.get("QT_QPA_PLATFORM", "unset")
              report["outer_net"] = os.readlink("/proc/self/ns/net")
              started = time.monotonic()
              with log.open("w") as output:
                  process = subprocess.Popen(
                      command, env=env, stdout=output, stderr=subprocess.STDOUT,
                      start_new_session=True
                  )
                  report["launcher_pid"] = process.pid
                  check_termination()
                  startup_limit = 30 if mode == "catalog" else 90
                  report["startup_limit_seconds"] = startup_limit
                  deadline = started + startup_limit
                  window = owner = None
                  while time.monotonic() < deadline:
                      check_termination()
                      if process.poll() is not None:
                          raise RuntimeError(
                              f"Launcher exited before GUI: {process.returncode}"
                          )
                      result = subprocess.run(
                          ["xdotool", "search", "--onlyvisible", "--name",
                           "^TractEdit GUI - Interactive Editor( — TractEdit)?$"],
                          capture_output=True, text=True, timeout=5
                      )
                      for candidate in result.stdout.split():
                          raw_pid = subprocess.run(
                              ["xdotool", "getwindowpid", candidate],
                              capture_output=True, text=True, timeout=5
                          ).stdout.strip()
                          if not raw_pid.isdecimal():
                              continue
                          pid = owning_host_pid(int(raw_pid), process.pid)
                          if pid is not None:
                              window, owner = candidate, pid
                              report["window_reported_pid"] = int(raw_pid)
                              break
                      if window:
                          break
                      time.sleep(1)
                  if not window:
                      raise RuntimeError("Main application window and owner not found")
                  appeared = time.monotonic()
                  report["window_seconds"] = round(appeared - started, 3)
                  # A slow xdotool query must not admit a window after the deadline.
                  if appeared > deadline:
                      raise RuntimeError(f"Main window exceeded {startup_limit}s startup limit")
                  check_termination()
                  # Current catalog worker waits up to 30 seconds; the historic
                  # eleven-second report does not establish a startup cause.
                  report["catalog_wait_reference_seconds"] = 30
                  report["window_id"] = window
                  report["owner_pid"] = owner
                  until = max(started + 30, appeared + 15)
                  while time.monotonic() < until:
                      check_termination()
                      if process.poll() is not None:
                          raise RuntimeError(
                              f"Launcher ended during observation: {process.returncode}"
                          )
                      os.kill(owner, 0)
                      time.sleep(1)
                  visible = subprocess.run(
                      ["xdotool", "search", "--onlyvisible", "--name",
                       "^TractEdit GUI - Interactive Editor( — TractEdit)?$"],
                      capture_output=True, text=True, timeout=5
                  ).stdout.split()
                  if window not in visible or not (
                      os.getpgid(owner) == process.pid
                      or child_of(owner, process.pid)
                  ):
                      raise RuntimeError("Application window or owner disappeared")
                  report["observed_seconds"] = round(time.monotonic() - started, 3)
                  report["owner_executable"] = os.readlink(f"/proc/{owner}/exe")
                  report["owner_net"] = os.readlink(f"/proc/{owner}/ns/net")
                  if mode in ("plain-mount", "firejail-mount"):
                      mounts = Path(f"/proc/{owner}/mountinfo").read_text()
                      mounted = [
                          line for line in mounts.splitlines()
                          if ".mount_" in line and "fuse" in line
                          and Path(image).name in line
                      ]
                      (evidence / f"{mode}.mounts").write_text(
                          "\n".join(mounted) + "\n"
                      )
                      if not mounted:
                          raise RuntimeError("The final AppImage is not FUSE mounted")
                      mountpoints = [line.split()[4] for line in mounted]
                      if not any(
                          report["owner_executable"].startswith(point + "/")
                          for point in mountpoints
                      ):
                          raise RuntimeError(
                              "GUI owner does not run from the AppImage mount"
                          )
                  if mode.startswith("firejail") or mode == "catalog":
                      if report["owner_net"] == report["outer_net"]:
                          raise RuntimeError("Firejail network namespace not created")
                      route = Path(f"/proc/{owner}/net/route").read_text()
                      interfaces = Path(f"/proc/{owner}/net/dev").read_text()
                      (evidence / f"{mode}.network").write_text(
                          f"route:\n{route}\ninterfaces:\n{interfaces}"
                      )
                      names = [
                          line.split(":")[0].strip()
                          for line in interfaces.splitlines() if ":" in line
                      ]
                      if any(name != "lo" for name in names) or len(route.splitlines()) > 1:
                          raise RuntimeError(
                              "Firejail has an external interface or route"
                          )
                      launcher_log = log.read_text(errors="replace").lower()
                      if ("disabling firejail" in launcher_log
                              or "sandbox is disabled" in launcher_log):
                          raise RuntimeError("Firejail reported a disabled sandbox")
                  screenshot = evidence / f"{mode}.xwd"
                  subprocess.run(
                      ["xwd", "-silent", "-id", window, "-out", str(screenshot)],
                      check=True, timeout=20
                  )
                  if screenshot.stat().st_size == 0:
                      raise RuntimeError("Empty desktop screenshot")
                  check_termination()
                  report["passed"] = True
          except Exception as error:
              report["error"] = str(error)
              raise
          finally:
              try:
                  stop_application()
              except Exception as error:
                  report["passed"] = False
                  report["cleanup_error"] = str(error)
                  raise
              finally:
                  if termination_signal is not None:
                      report["passed"] = False
                      report["termination_signal"] = termination_signal
                  (evidence / f"{mode}.json").write_text(
                      json.dumps(report, indent=2) + "\n"
                  )
          check_termination()
          (evidence / f"{mode}.pass").write_text("passed\n")
          PY
          cat > "$RUNNER_TEMP/appimage-gui-probe.sh" <<'SH'
          set -euo pipefail
          mode=$1
          export XDG_DATA_HOME
          XDG_DATA_HOME=$(mktemp -d "$RUNNER_TEMP/xdg-$mode.XXXXXX")
          trap 'rm -rf "$XDG_DATA_HOME"' EXIT
          # Keep Xvfb alive while the Python supervisor handles TERM and cleans up.
          # Allow a bounded in-flight query (20s) plus group cleanup before KILL.
          if ! xvfb-run -a timeout --signal=TERM --kill-after=35s 180s \
            python3 "$RUNNER_TEMP/appimage-gui-probe.py" "$mode" \
            > "evidence/$mode-supervisor.log" 2>&1; then
            cat "evidence/$mode-supervisor.log"
            if [[ -f "evidence/$mode.log" ]]; then
              tail -n 80 "evidence/$mode.log"
            fi
            exit 1
          fi
          test -s "evidence/$mode.pass"
          test ! -e "$XDG_DATA_HOME/applications/tractedit-appimage.desktop"
          test ! -e "$XDG_DATA_HOME/mime/packages/tractedit-mime.xml"
          SH

      # ========== AppImage Desktop and Firejail Probes ==========
      # Extraction cannot compensate for a mount failure.
      - name: Probe ordinary FUSE and extraction launches
        id: fuse-launch
        shell: bash
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/appimage-gui-probe.sh" plain-mount
          bash "$RUNNER_TEMP/appimage-gui-probe.sh" plain-extract

      - name: Probe ordinary Firejail launches
        id: firejail-launch
        shell: bash
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/appimage-gui-probe.sh" firejail-mount
          bash "$RUNNER_TEMP/appimage-gui-probe.sh" firejail-extract

      - name: Probe catalog Firejail AppImage launch
        id: catalog-launch
        shell: bash
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/appimage-gui-probe.sh" catalog

      - name: Report validation diagnostics
        if: always()
        shell: python {0}
        env:
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: |
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["VALIDATION_STEPS"])

          def result(*identities):
              outcomes = [steps.get(key, {}).get("outcome") for key in identities]
              for outcome, label in (("failure", "FAIL"), ("cancelled", "CANCELLED")):
                  if outcome in outcomes:
                      return label
              if all(outcome == "success" for outcome in outcomes):
                  return "PASS"
              return "SKIP" if "skipped" in outcomes else "NOT RUN"

          checks = (
              ("AppImage identity and provenance", result("identity")),
              ("ABI and GLIBC compatibility", result("abi-audit")),
              ("GUI via FUSE and extraction", result("fuse-launch")),
              ("GUI via Firejail", result("firejail-launch")),
              ("Catalog AppImage launch", result("catalog-launch")),
          )
          root = Path("evidence")
          reports = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix in (".json", ".log", ".txt", ".network", ".mounts")
          )
          remaining = 64000
          for path in reports:
              if remaining <= 0:
                  break
              limit = min(8000, remaining)
              with path.open("rb") as stream:
                  stream.seek(max(0, path.stat().st_size - limit))
                  tail = stream.read(limit).decode("utf-8", errors="replace")
              print(f"--- {path.as_posix()} (last {limit} bytes at most) ---")
              print(tail)
              remaining -= limit
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Validation results\n\n")
              summary.write("| Check | Result |\n| --- | --- |\n")
              for label, status in checks:
                  summary.write(f"| {label} | {status} |\n")
              summary.write("\nDetails are in the **Report validation diagnostics** step log.\n")

  # ========== Shared Package Validation Across All Four Formats ==========
  # Scientific/mesh checks are shared; extra AppImage GUI checks stay in appimage-compatibility.
  validate-packages:
    name: Validate package (${{ matrix.target }}, ${{ matrix.os }})
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: dmg
            artifact_name: TractEdit-macOS-arm64
            enabled: ${{ inputs.build_macos }}
          - os: ubuntu-24.04
            target: deb
            artifact_name: TractEdit-Linux-DEB
            enabled: ${{ inputs.build_deb }}
          - os: windows-latest
            target: exe
            artifact_name: TractEdit-Windows-x64
            enabled: ${{ inputs.build_windows }}
          - os: ubuntu-22.04
            target: appimage
            artifact_name: TractEdit-Linux-AppImage
            enabled: ${{ inputs.build_appimage }}
          - os: ubuntu-24.04
            target: appimage
            artifact_name: TractEdit-Linux-AppImage
            enabled: ${{ inputs.build_appimage }}
    steps:
      - name: Checkout verification inputs
        if: matrix.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.11 for independent verification
        if: matrix.enabled
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Download the final package
        if: matrix.enabled
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact
      - name: Prepare isolated package and record identity
        id: package-identity
        if: matrix.enabled && matrix.target != 'appimage'
        env:
          TARGET: ${{ matrix.target }}
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          import tomllib
          import zipfile

          target = os.environ["TARGET"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["poetry"]["version"]
          filenames = {
              "dmg": f"TractEdit-{version}-macos-arm64.dmg",
              "deb": f"TractEdit_{version}_amd64.deb",
              "exe": f"TractEdit-{version}-windows-x64.zip",
          }
          files = list(Path("artifact").iterdir())
          package = Path("artifact") / filenames[target]
          if files != [package] or not package.is_file():
              raise RuntimeError(f"Expected exactly {package}, found {files}")
          with package.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          root = Path(os.environ["RUNNER_TEMP"]) / "package-under-test"
          root.mkdir()
          if target == "exe":
              with zipfile.ZipFile(package) as archive:
                  archive.extractall(root)
              executable = root / "TractEdit/TractEdit.exe"
          elif target == "deb":
              subprocess.run(["dpkg-deb", "--extract", str(package), str(root)], check=True, timeout=120)
              executable = root / "opt/tractedit/tractedit"
          else:
              # Mount read-only and keep the original bundle intact, including symlinks.
              subprocess.run(["hdiutil", "attach", str(package.resolve()), "-readonly",
                              "-nobrowse", "-mountpoint", str(root)], check=True, timeout=120)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                  output.write(f"DMG_MOUNT={root.as_posix()}\n")
              bundle = root / "TractEdit.app"
              with (bundle / "Contents/Info.plist").open("rb") as stream:
                  plist = plistlib.load(stream)
              executable_name = plist["CFBundleExecutable"]
              obj_types = [doc for doc in plist["CFBundleDocumentTypes"]
                           if "obj" in doc.get("CFBundleTypeExtensions", [])]
              if len(obj_types) != 1 or (obj_types[0].get("CFBundleTypeRole"),
                                         obj_types[0].get("LSHandlerRank")) != ("Viewer", "Alternate"):
                  raise RuntimeError("Expected one alternate OBJ viewer in packaged Info.plist")
              executable = bundle / "Contents/MacOS" / executable_name
          if not executable.is_file():
              raise RuntimeError(f"Missing packaged executable: {executable}")
          Path("evidence").mkdir(exist_ok=True)
          identity = {"package": package.name, "package_sha256": digest,
                      "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                      "target": target, "executable": str(executable)}
          Path("evidence/identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PACKAGE={package.resolve().as_posix()}\nEXPECTED_SHA256={digest}\n")
              output.write(f"EXECUTABLE={executable.as_posix()}\n")
      - name: Verify AppImage identity and prepare executable
        id: identity
        shell: python {0}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          from pathlib import Path
          Path("evidence").mkdir(exist_ok=True)
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          folder = Path("artifact")
          manifest = json.loads((folder / "AppImage-manifest.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          filename = f"TractEdit-{version}-x86_64.AppImage"
          images = list(folder.glob("*.AppImage"))
          if len(images) != 1 or images[0].name != filename:
              raise SystemExit(f"Expected only {filename}; found {images}")
          image = images[0]
          with image.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          expected = {
              "commit": os.environ["EXPECTED_COMMIT"],
              "run_id": os.environ["EXPECTED_RUN_ID"],
              "version": version,
              "filename": filename,
              "size_bytes": image.stat().st_size,
              "appimage_sha256": digest,
              "workflow_sha256": hashlib.sha256(
                  Path(".github/workflows/build-releases.yml").read_bytes()
              ).hexdigest(),
              "appimagetool_version": "1.9.1",
              "appimagetool_sha256": "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0",
              "runtime_version": "20251108",
              "runtime_sha256": "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d",
              "runtime_option": "--runtime-file appimage-tools/runtime-x86_64",
          }
          if any(manifest.get(key) != value for key, value in expected.items()):
              raise SystemExit(f"AppImage manifest mismatch: {expected} != {manifest}")
          if not re.fullmatch(r"[1-9]\d*", str(manifest.get("build_attempt", ""))):
              raise SystemExit("Invalid build attempt")
          if (folder / "AppImage.sha256").read_text() != f"{digest}  {filename}\n":
              raise SystemExit("AppImage.sha256 mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image.resolve()}\nsha256={digest}\n")
          Path("evidence/identity.json").write_text(json.dumps(manifest, indent=2) + "\n")
          image.chmod(image.stat().st_mode | 0o111)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PACKAGE={image.resolve().as_posix()}\n")
              output.write(f"EXECUTABLE={image.resolve().as_posix()}\nEXPECTED_SHA256={digest}\n")
        if: matrix.enabled && matrix.target == 'appimage'
      - name: Install Linux desktop runtime
        if: matrix.enabled && matrix.target == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/linux/install-apt-dependencies.sh libgl1 libegl1 libxcb-cursor0 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            xvfb xauth xdotool x11-apps x11-utils
      - name: Install headless Linux runtime libraries
        shell: bash
        run: |
