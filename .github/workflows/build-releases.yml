          mount = os.environ["DMG_MOUNT"]
          result = subprocess.run(["hdiutil", "detach", mount],
                                  capture_output=True, text=True, check=False, timeout=30)
          print(result.stdout, result.stderr)
          if result.returncode == 16:  # EBUSY: the test image was mounted read-only.
              try:
                  holders = subprocess.run(["lsof", "-nP", "+f", "--", mount],
                                           capture_output=True, text=True, check=False, timeout=10)
                  print(holders.stdout[-16000:], holders.stderr[-4000:])
              except (OSError, subprocess.TimeoutExpired) as error:
                  print(f"Could not inspect DMG holders: {error}")
              result = subprocess.run(["hdiutil", "detach", "-force", mount],
                                      capture_output=True, text=True, check=False, timeout=30)
              print(result.stdout, result.stderr)
          result.check_returncode()
      - name: Report validation diagnostics
        if: always() && matrix.enabled
        shell: python {0}
        env:
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: |
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["VALIDATION_STEPS"])

          def result(*identities):
              outcomes = [steps.get(key, {}).get("outcome") for key in identities]
              for outcome, label in (("failure", "FAIL"), ("cancelled", "CANCELLED")):
                  if outcome in outcomes:
                      return label
              if all(outcome == "success" for outcome in outcomes):
                  return "PASS"
              return "SKIP" if "skipped" in outcomes else "NOT RUN"

          identity = "identity" if os.environ["TARGET"] == "appimage" else "package-identity"
          checks = (
              ("Package identity", result(identity)),
              ("Conversion, TDI and invalid input", result("scientific-run", "scientific-checks")),
              ("Advanced worker", result("advanced-worker")),
              ("GUI and mesh display", result("packaged-gui")),
              ("Surface mapping and exports", result("surface-mapping")),
          )
          root = Path("evidence")
          reports = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix in (".json", ".log", ".txt", ".network", ".mounts")
          )
          remaining = 64000
          for path in reports:
              if remaining <= 0:
                  break
              limit = min(8000, remaining)
              with path.open("rb") as stream:
                  stream.seek(max(0, path.stat().st_size - limit))
                  tail = stream.read(limit).decode("utf-8", errors="replace")
              print(f"--- {path.as_posix()} (last {limit} bytes at most) ---")
              print(tail)
              remaining -= limit
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Validation results\n\n")
              summary.write("| Check | Result |\n| --- | --- |\n")
              for label, status in checks:
                  summary.write(f"| {label} | {status} |\n")
              summary.write("\nDetails are in the **Report validation diagnostics** step log.\n")
    env:
      TARGET: ${{ matrix.target }}
