      - name: Check packaged surface mapping and writers
        id: surface-mapping
        if: matrix.enabled
        shell: python {0}
        timeout-minutes: 4
        run: |
          import os
          from pathlib import Path
          import subprocess
          import textwrap

          root = Path(os.environ["RUNNER_TEMP"]) / "surface-mapping-smoke"
          root.mkdir()
          payload = root / "payload.py"
          payload.write_text(textwrap.dedent(r'''
          import hashlib
          import json
          from pathlib import Path
          import sys
          import tempfile
          import time
          import traceback

          root = Path(__file__).parent

          def phase(name):
              (root / "phase.txt").write_text(name, "utf-8")

          def check_mapping():
              phase("imports")
              import numpy as np
              import nibabel as nib
              import vtk
              from vtk.util.numpy_support import numpy_to_vtk, vtk_to_numpy
              from PyQt6.QtWidgets import QApplication
              import tractedit_pkg.surface_mapping.process as worker
              from tractedit_pkg.main_window import MainWindow
              from tractedit_pkg.surface_mapping import SurfaceMappingParameters, SurfaceMappingRequest
              from tractedit_pkg.visualization.surface_mapping_export import FigureOptions

              assert getattr(sys, "frozen", False), "Source Python is not a native package gate"
              assert Path(worker.__file__).resolve().is_relative_to(Path(sys._MEIPASS).resolve())
              assert vtk.vtkVersion.GetVTKVersion() == "9.2.6"
              # Exercise aliased TEMP paths even when the runner uses long names.
              temporary = root / "temporary" / "alias"
              temporary.mkdir(parents=True)
              tempfile.tempdir = str(temporary / "..")
              phase("GUI setup")
              app = QApplication.instance() or QApplication([])
              window = MainWindow()
              window.show()

              def wait(predicate):
                  deadline = time.monotonic() + 60
                  while not predicate():
                      if time.monotonic() > deadline:
                          raise TimeoutError("Packaged mapping did not complete")
                      app.processEvents()
                      time.sleep(0.005)
                  app.processEvents()

              try:
                  phase("mesh loading")
                  points = vtk.vtkPoints()
                  coordinates = np.array([[0., 0., 0.], [2., 0., 0.], [0., 2., 0.]], dtype=np.float64)
                  points.SetData(numpy_to_vtk(coordinates, deep=True))
                  cells = vtk.vtkCellArray()
                  cells.InsertNextCell(3, [0, 1, 2])
                  data = vtk.vtkPolyData()
                  data.SetPoints(points)
                  data.SetPolys(cells)
                  path = root / "target.vtp"
                  writer = vtk.vtkXMLPolyDataWriter()
                  writer.SetFileName(str(path))
                  writer.SetInputData(data)
                  assert writer.Write() == 1
                  window.mesh_manager.load(str(path), "RAS")
                  wait(lambda: window._mesh_loader_thread is None)
                  key = next(iter(window.mesh_layers))
                  window.tractogram_data = nib.streamlines.ArraySequence([
                      np.array([[0.25, 0.25, -0.1], [0.25, 0.25, 0.1]], dtype=np.float32)])
                  window.visible_indices = {0}
                  window.manual_visible_indices = {0}
                  window._tractogram_data_version += 1
                  window._visibility_version += 1
                  manager = window.surface_mapping_manager
                  phase("endpoint computation")
                  assert manager.start(key, SurfaceMappingParameters())
                  wait(lambda: not manager.busy)
                  assert manager.current, manager.message
                  assert manager.bundle.result.diagnostics.assigned_endpoints == 2
                  manager.set_display("map_enabled", True)
                  manager.set_display("density_enabled", True)
                  window.mesh_manager.fit(key)
                  panel = window.vtk_panel
                  camera = panel.scene.GetActiveCamera()

                  def state():
                      return (camera.GetPosition(), camera.GetFocalPoint(), camera.GetViewUp(),
                              panel.render_window.GetSize(), panel.scene.GetViewport(),
                              panel.scene.GetBackground(),
                              [(prop, prop.GetVisibility()) for prop in panel.scene.GetViewProps()])

                  before = state()
                  phase("endpoint export")
                  paths = manager.export_to(root / "mapping", figure_options=FigureOptions(800, 600))
                  assert paths and state() == before and manager.current
                  phase("VTP validation")
                  for role in ("surface", "points"):
                      reader = vtk.vtkXMLPolyDataReader()
                      reader.SetFileName(str(paths[role]))
                      reader.Update()
                      output = reader.GetOutput()
                      assert vtk_to_numpy(output.GetPoints().GetData()).dtype == np.float64
                      assert output.GetFieldData().GetAbstractArray("SPACE").GetValue(0) == "RAS"
                      attributes = output.GetCellData() if role == "surface" else output.GetPointData()
                      ids = attributes.GetArray("triangle_id" if role == "surface" else "streamline_id")
                      assert vtk_to_numpy(ids).dtype == np.int64
                      if role == "surface":
                          np.testing.assert_array_equal(vtk_to_numpy(output.GetPoints().GetData()), coordinates)
                          assert output.GetNumberOfPolys() == 1
                          values = vtk_to_numpy(output.GetPointData().GetArray("endpoint_contributions"))
                          np.testing.assert_allclose(values.sum(), 2)
                          assert "mm" in output.GetFieldData().GetAbstractArray("endpoint_density_units").GetValue(0)
                      else:
                          assert output.GetNumberOfVerts() == 2
                  phase("PNG validation")
                  reader = vtk.vtkPNGReader()
                  reader.SetFileName(str(paths["figure"]))
                  reader.Update()
                  image = reader.GetOutput()
                  assert image.GetDimensions() == (800, 600, 1)
                  pixels = vtk_to_numpy(image.GetPointData().GetScalars())
                  assert pixels.shape[1] == 3 and np.std(pixels) > 5
                  assert paths["figure"].read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"
                  sidecar = json.loads(paths["figure_metadata"].read_text("utf-8"))
                  assert sidecar["legend"]["visible"] and "mm" in sidecar["legend"]["title"]
                  phase("screenshot")
                  from PyQt6.QtWidgets import QFileDialog
                  screenshot = root / "existing-screenshot.png"
                  original_dialog = QFileDialog.getSaveFileName
                  QFileDialog.getSaveFileName = lambda *args, **kwargs: (str(screenshot), "PNG")
                  try:
                      panel.take_screenshot()
                  finally:
                      QFileDialog.getSaveFileName = original_dialog
                  assert screenshot.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n" and state() == before
                  provenance = json.loads(paths["provenance"].read_text("utf-8"))
                  assert provenance["coordinate_units"] == "mm"
                  for record in provenance["files"]:
                      assert hashlib.sha256((root / record["name"]).read_bytes()).hexdigest() == record["sha256"]
                  phase("translucent export")
                  window.mesh_manager.set_opacity(key, 0.4)
                  before = state()
                  assert manager.export_to(root / "translucent", scientific=False,
                                           figure_options=FigureOptions(640, 480))
                  assert state() == before
                  try:
                      FigureOptions(transparent=True)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError("Unverified RGBA must remain disabled")
                  manager.remove()
                  phase("intersection computation")
                  assert manager.start(key, SurfaceMappingParameters(mode="surface_intersections"))
                  wait(lambda: not manager.busy)
                  assert manager.current and manager.bundle.result.diagnostics.crossing_events == 1
                  phase("intersection export")
                  manager.export_to(root / "intersections")
                  manager.remove()
                  phase("surface polygon smoke")
                  from tractedit_pkg.mesh.polygon import load_surface
                  from tractedit_pkg.mesh.polygon_io import (
                      read_obj_pair,
                      read_pair,
                      write_obj_pair,
                      write_pair,
                  )

                  assert window.mesh_polyline_manager.polygon_editor() is not None
                  layer = window.mesh_layers[key]
                  surface = load_surface(layer, lambda: None)
                  assert surface.path(0, 1) == [0, 1]
                  loop = np.array([0, 1, 2, 0], dtype=np.int64)
                  poly_faces = surface.region(loop.tolist(), 0)
                  assert np.array_equal(poly_faces, np.array([0], dtype=np.int64))
                  poly_region = {"loop": loop, "faces": poly_faces, "digest": surface.digest}
                  vtp_pair = (root / "smoke_polygon.vtp", root / "smoke_patch.vtp")
                  write_pair(vtp_pair, surface, poly_region, layer)
                  assert np.array_equal(read_pair(*vtp_pair, surface, layer)["faces"], poly_faces)
                  obj_pair = (root / "smoke_polygon.obj", root / "smoke_patch.obj")
                  poly_color = (0.2, 0.6, 0.9)
                  write_obj_pair(obj_pair, surface, poly_region, layer, poly_color)
                  obj_region, obj_color = read_obj_pair(
                      *obj_pair, surface, layer, return_color=True
                  )
                  assert np.array_equal(obj_region["faces"], poly_faces)
                  assert np.allclose(obj_color, poly_color)
                  assert not window._background_workers
                  scope_code = SurfaceMappingRequest.__post_init__.__code__
                  scope_signature = hashlib.sha256(scope_code.co_code + repr(scope_code.co_names).encode()).hexdigest()
                  phase("result publication")
                  (root / "result.json").write_text(json.dumps({"status": "PASS", "vtk": vtk.vtkVersion.GetVTKVersion(),
                      "scope_signature": scope_signature,
                      "worker_module": worker.__file__, "executable": sys.executable,
                      "checks": "frozen nested worker; endpoint/intersection; VTP float64/int64/RAS/mm; PNG RGB/legend; checksums; translucency/restoration; RGBA disabled; surface polygon VTP/OBJ roundtrip"}), "utf-8")
              except BaseException:
                  (root / "error.log").write_text(traceback.format_exc(), "utf-8")
                  raise
              finally:
                  window.surface_mapping_manager.close()
                  window._shutdown_requested = True
                  window.close()
                  app.processEvents()

          try:
              check_mapping()
          except BaseException:
              (root / "error.log").write_text(traceback.format_exc(), "utf-8")
              raise
          '''), encoding="utf-8")
          supervisor = root / "supervisor.py"
          supervisor.write_text(textwrap.dedent(r'''
          import multiprocessing
          import multiprocessing.spawn
          from pathlib import Path
          import runpy
          import sys

          if __name__ == "__main__":
              if sys.platform != "win32":
                  from multiprocessing import resource_tracker

                  resource_tracker.ensure_running()
              multiprocessing.set_executable(sys.argv[1])
              original = multiprocessing.spawn.get_preparation_data
              def preparation(name):
                  data = original(name)
                  for key in ("sys_path", "init_main_from_name", "init_main_from_path"):
                      data.pop(key, None)
                  return data
              sys.frozen = True
              multiprocessing.spawn.get_preparation_data = preparation
              process = multiprocessing.get_context("spawn").Process(target=runpy.run_path, args=(sys.argv[2],))
              try:
                  process.start()
                  process.join(150)
                  if process.is_alive() or process.exitcode:
                      raise RuntimeError(f"Packaged surface mapping failed: {process.exitcode}")
                  root = Path(sys.argv[2]).parent
                  if (root / "error.log").is_file():
                      raise RuntimeError("Packaged surface mapping checks failed; see error.log")
                  if not (root / "result.json").is_file():
                      progress = root / "phase.txt"
                      last_phase = progress.read_text("utf-8") if progress.is_file() else "not started"
                      raise RuntimeError(
                          f"Packaged surface mapping exited without result.json "
                          f"(exit code {process.exitcode}, last phase: {last_phase})"
                      )
              finally:
                  if process.pid is not None:
                      if process.is_alive():
                          process.kill()
                      process.join()
                  process.close()
          '''), encoding="utf-8")
          env = os.environ.copy()
          for name in ("PYTHONPATH", "PYTHONHOME", "QT_QPA_PLATFORM", "APPIMAGE_EXTRACT_AND_RUN"):
              env.pop(name, None)
          if env["TARGET"] == "appimage":
              env["APPIMAGE_EXTRACT_AND_RUN"] = "1"
          command = [env["VERIFIER"], "-B", str(supervisor), env["EXECUTABLE"], str(payload)]
          if env["RUNNER_OS"] == "Linux":
              command = ["xvfb-run", "-a", *command]
          try:
              subprocess.run(command, cwd=root, env=env, check=True, timeout=180)
          finally:
              for name in ("phase.txt", "result.json", "error.log"):
                  path = root / name
                  if path.exists():
                      print(path.read_text("utf-8"))
      - name: Diagnose macOS GUI failure
        if: always() && matrix.enabled && runner.os == 'macOS' && steps.packaged-gui.outcome == 'failure'
        shell: python {0}
        run: |
          from pathlib import Path
          import time

          evidence = Path("evidence")
          evidence.mkdir(exist_ok=True)
          sections = []
          log = evidence / "gui.log"
          if log.is_file():
              with log.open("rb") as stream:
                  stream.seek(max(0, log.stat().st_size - 8000))
                  sections.append("--- gui.log tail ---\n" + stream.read(8000).decode("utf-8", errors="replace"))
          recent = []
          for root in (Path.home() / "Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")):
              if root.is_dir():
                  recent.extend(path for path in root.glob("TractEdit*")
                                if path.suffix in (".ips", ".crash") and path.stat().st_mtime >= time.time() - 900)
          for path in sorted(recent, key=lambda item: item.stat().st_mtime, reverse=True)[:3]:
              with path.open("rb") as stream:
                  sections.append(f"--- {path.name} ---\n" + stream.read(24000).decode("utf-8", errors="replace"))
          if not recent:
              sections.append("No recent TractEdit macOS crash report was available.")
          diagnostic = "\n".join(sections)
          (evidence / "macos-crash.log").write_text(diagnostic, "utf-8")
          print(diagnostic)

