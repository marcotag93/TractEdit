      - name: Check packaged Advanced worker
        id: advanced-worker
        if: matrix.enabled
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import textwrap

          script = Path(os.environ["RUNNER_TEMP"]) / "package-overlay-probe.py"
          script.write_text(textwrap.dedent(r'''
          import json
          import multiprocessing
          import multiprocessing.spawn
          from pathlib import Path
          import sys

          def check_worker(executable, source_root, root):
              import numpy as np

              # Only the verifier imports checkout code to identify the spawn target.
              sys.path.insert(0, str(source_root))
              from tractedit_pkg.mesh.process import _prepare_overlay
              sys.path.pop(0)
              if sys.platform != "win32":
                  from multiprocessing import resource_tracker

                  resource_tracker.ensure_running()
              multiprocessing.set_executable(str(executable))
              context = multiprocessing.get_context("spawn")
              count = 250_002
              points = np.column_stack((np.arange(count) // 2, np.arange(count) % 2,
                                        np.zeros(count)))
              for component in ("boundary_edges", "surface_normals"):
                  folder = root / component
                  (folder / "input").mkdir(parents=True)
                  (folder / "output").mkdir()
                  arrays = []

                  def save(values, vtk_type, components=1):
                      index = len(arrays)
                      np.save(folder / "input" / f"{index}.npy", values, allow_pickle=False)
                      arrays.append({"name": None, "type": vtk_type, "components": components})
                      return index

                  point_array = save(points, 11, 3)
                  cells = []
                  for index in range(4):
                      offsets = np.array([0, count] if index == 1 else [0], dtype=np.int64)
                      ids = np.arange(count if index == 1 else 0, dtype=np.int64)
                      cells.append((save(offsets, 12), save(ids, 12)))
                  document = {
                      "result": {"path": "", "point_count": count, "polygon_count": 0,
                                 "strip_count": 1, "source_bounds": [0, count // 2 - 1, 0, 1, 0, 0],
                                 "space_metadata": {"source": "vtp_field_data", "declarations": [],
                                                    "status": "missing", "coordinate_system": None}},
                      "points": point_array, "cells": cells, "arrays": arrays,
                      "attributes": [{"arrays": [], "active": {}} for _ in range(3)],
                  }
                  (folder / "input/result.json").write_text(json.dumps(document), "utf-8")
                  process = context.Process(target=_prepare_overlay, args=(str(folder), component))
                  frozen = getattr(sys, "frozen", None)
                  original_preparation = multiprocessing.spawn.get_preparation_data

                  def packaged_preparation(name):
                      data = original_preparation(name)
                      # Preserve the child's bundled paths; never replay this verifier.
                      for key in ("sys_path", "init_main_from_name", "init_main_from_path"):
                          data.pop(key, None)
                      return data

                  try:
                      try:
                          sys.frozen = True
                          multiprocessing.spawn.get_preparation_data = packaged_preparation
                          process.start()
                      finally:
                          multiprocessing.spawn.get_preparation_data = original_preparation
                          if frozen is None:
                              del sys.frozen
                          else:
                              sys.frozen = frozen
                      process.join(60)
                      if process.is_alive():
                          raise RuntimeError(f"Packaged {component} worker timed out")
                      if process.exitcode != 0:
                          raise RuntimeError(f"Packaged {component} worker exited {process.exitcode}")
                      error = folder / "error.json"
                      if error.exists():
                          raise RuntimeError(error.read_text("utf-8"))
                      output = json.loads((folder / "output/result.json").read_text("utf-8"))

                      def read(index):
                          return np.load(folder / "output" / f"{index}.npy", allow_pickle=False)

                      actual_points = read(output["points"])
                      if component == "boundary_edges":
                          offsets, connectivity = map(read, output["cells"][2])
                          np.testing.assert_array_equal(np.diff(offsets), np.full(count, 2))
                          ids = (actual_points[:, 0] * 2 + actual_points[:, 1]).astype(np.int64)
                          edges = np.sort(ids[connectivity].reshape(-1, 2), axis=1)
                          expected = np.vstack(([[0, 1], [count - 2, count - 1]],
                                                np.column_stack((np.arange(count - 2), np.arange(2, count)))))
                          def order(values):
                              return values[np.lexsort((values[:, 1], values[:, 0]))]

                          np.testing.assert_array_equal(order(edges), order(expected))
                      else:
                          assert json.loads((folder / "faces.json").read_text("utf-8")) == count - 2
                          assert actual_points.shape == (10_000, 3)
                          vector_id = output["attributes"][0]["arrays"][0]
                          np.testing.assert_allclose(read(vector_id), np.tile([0, 0, -1], (10_000, 1)))
                      print(f"Packaged {component}: PASS", flush=True)
                  finally:
                      if process.pid is not None:
                          if process.is_alive():
                              process.kill()
                          process.join()
                      process.close()

          if __name__ == "__main__":
              check_worker(Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3]))
          '''), encoding="utf-8")
          env = os.environ.copy()
          for key in ("PYTHONPATH", "PYTHONHOME", "QT_QPA_PLATFORM", "APPIMAGE_EXTRACT_AND_RUN"):
              env.pop(key, None)
          if os.environ["TARGET"] == "appimage":
              env["APPIMAGE_EXTRACT_AND_RUN"] = "1"
          log_path = Path("evidence/advanced-worker.log")
          try:
              with log_path.open("w") as log:
                  subprocess.run([os.environ["VERIFIER"], "-B", str(script), os.environ["EXECUTABLE"],
                                  str(Path.cwd()), str(script.parent / "overlay-smoke")],
                                 cwd=script.parent, env=env, stdout=log, stderr=subprocess.STDOUT,
                                 check=True, timeout=150)
          finally:
              with log_path.open("rb") as log:
                  log.seek(max(0, log_path.stat().st_size - 8000))
                  print(log.read().decode("utf-8", errors="replace"), flush=True)

      - name: Prepare native GUI probe
        if: matrix.enabled
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          script = Path(os.environ["RUNNER_TEMP"]) / "package-gui-probe.py"
          script.write_text(r'''
          import ctypes
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time
          import psutil
          import numpy as np
          from PIL import Image, ImageGrab

          evidence = Path(os.environ["GITHUB_WORKSPACE"]) / "evidence"
          title = "TractEdit GUI - Interactive Editor"
          report = {"passed": False, "startup_limit_seconds": 90}
          process = None
          owned = set()
          interrupted = None

          def on_signal(signum, frame):
              global interrupted
              interrupted = signum

          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)

          def check_signal():
              if interrupted is not None:
                  raise RuntimeError(f"GUI probe interrupted by signal {interrupted}")

          def live(item):
              try:
                  return item.is_running() and item.status() != psutil.STATUS_ZOMBIE
              except psutil.NoSuchProcess:
                  return False

          def refresh_owned():
              for item in list(owned):
                  try:
                      owned.update(item.children(recursive=True))
                  except psutil.NoSuchProcess:
                      pass
              return {item.pid for item in owned if live(item)}

          def windows(pids, name=title):
              if sys.platform == "win32":
                  from ctypes import wintypes
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  callback_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
                  user.EnumWindows.argtypes = [callback_type, wintypes.LPARAM]
                  user.EnumWindows.restype = wintypes.BOOL
                  user.IsWindowVisible.argtypes = [wintypes.HWND]
                  user.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.DWORD)]
                  user.GetWindowTextW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
                  user.GetClassNameW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
                  user.GetWindowRect.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.RECT)]
                  found = []
                  @callback_type
                  def visit(hwnd, param):
                      pid = wintypes.DWORD()
                      user.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
                      text = ctypes.create_unicode_buffer(1024)
                      user.GetWindowTextW(hwnd, text, len(text))
                      window_class = ctypes.create_unicode_buffer(256)
                      user.GetClassNameW(hwnd, window_class, len(window_class))
                      rect = wintypes.RECT()
                      if (pid.value in pids and user.IsWindowVisible(hwnd) and (name is None or text.value == name)
                              and user.GetWindowRect(hwnd, ctypes.byref(rect))
                              and rect.right > rect.left and rect.bottom > rect.top):
                          found.append({"id": int(hwnd), "pid": pid.value, "title": text.value,
                                        "class": window_class.value,
                                        "bounds": [rect.left, rect.top, rect.right, rect.bottom]})
                      return True
                  if not user.EnumWindows(visit, 0):
                      raise ctypes.WinError(ctypes.get_last_error())
                  return found
              if sys.platform == "darwin":
                  import Quartz as q
                  records = q.CGWindowListCopyWindowInfo(
                      q.kCGWindowListOptionOnScreenOnly | q.kCGWindowListExcludeDesktopElements,
                      q.kCGNullWindowID)
                  found = []
                  for record in records or []:
                      bounds = record.get(q.kCGWindowBounds, {})
                      if (record.get(q.kCGWindowOwnerPID) in pids
                              and (name is None or record.get(q.kCGWindowName) == name)
                              and record.get(q.kCGWindowLayer) == 0
                              and bounds.get("Width", 0) > 0 and bounds.get("Height", 0) > 0):
                          found.append({"id": int(record[q.kCGWindowNumber]),
                                        "pid": int(record[q.kCGWindowOwnerPID]),
                                        "title": record.get(q.kCGWindowName, "")})
                  if not found and name == "Mesh coordinates":
                      for pid in pids:
                          result = subprocess.run(
                              ["osascript", "-e", 'tell application "System Events" to tell '
                               f'(first application process whose unix id is {pid}) '
                               'to get exists window "Mesh coordinates"'],
                              capture_output=True, text=True, check=True, timeout=5)
                          if result.stdout.strip() == "true":
                              found.append({"pid": pid, "title": name})
                  return found
              command = ["xdotool", "search", "--onlyvisible"]
              command += ["--class", ".*"] if name is None else ["--name", "^" + name + "$"]
              result = subprocess.run(command, capture_output=True, text=True, timeout=5)
              found = []
              for window in result.stdout.split():
                  pid = subprocess.run(["xdotool", "getwindowpid", window],
                                       capture_output=True, text=True, timeout=5).stdout.strip()
                  if pid.isdecimal() and int(pid) in pids:
                      caption = subprocess.run(["xdotool", "getwindowname", window],
                                               capture_output=True, text=True, timeout=5).stdout.strip()
                      found.append({"id": int(window), "pid": int(pid), "title": caption})
              return found

          def send_keys(*keys):
              require_owned_focus()
              if sys.platform == "win32":
                  codes = {"alt": 0x12, "ctrl": 0x11, "shift": 0x10, "return": 0x0d,
                           "home": 0x24, "down": 0x28}
                  values = [codes.get(k, ord(k.upper()) if len(k) == 1 else 0) for k in keys]
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  for value in values:
                      user.keybd_event(value, user.MapVirtualKeyW(value, 0), 0, 0)
                      time.sleep(0.05)
                  for value in reversed(values):
                      user.keybd_event(value, user.MapVirtualKeyW(value, 0), 2, 0)
                      time.sleep(0.05)
              elif sys.platform == "linux":
                  symbols = [{"return": "Return", "home": "Home", "down": "Down"}.get(k, k) for k in keys]
                  subprocess.run(["xdotool", "key", "--clearmodifiers", "--delay", "100", "+".join(symbols)],
                                 check=True, timeout=5)
              else:
                  modifiers = {"ctrl": "command down", "shift": "shift down", "alt": "option down"}
                  codes = {"return": 36, "home": 115, "down": 125}
                  action = ("key code " + str(codes[keys[-1]]) if keys[-1] in codes
                            else "keystroke " + json.dumps(keys[-1]))
                  if len(keys) > 1:
                      action += " using {" + ", ".join(modifiers[k] for k in keys[:-1]) + "}"
                  subprocess.run(["osascript", "-e", 'tell application "System Events" to ' + action],
                                 check=True, timeout=5)

          def type_path(path):
              require_owned_focus()
              if sys.platform == "win32":
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  from ctypes import wintypes as w
                  class Keyboard(ctypes.Structure):
                      _fields_ = [("vk", w.WORD), ("scan", w.WORD), ("flags", w.DWORD),
                                  ("time", w.DWORD), ("extra", ctypes.c_size_t)]
                  class Mouse(ctypes.Structure):
                      _fields_ = [("x", w.LONG), ("y", w.LONG), ("data", w.DWORD),
                                  ("flags", w.DWORD), ("time", w.DWORD), ("extra", ctypes.c_size_t)]
                  class Payload(ctypes.Union):
                      _fields_ = [("keyboard", Keyboard), ("mouse", Mouse)]
                  class Input(ctypes.Structure):
                      _fields_ = [("kind", w.DWORD), ("payload", Payload)]
                  encoded = str(path).encode("utf-16-le")
                  units = [int.from_bytes(encoded[i:i + 2], "little") for i in range(0, len(encoded), 2)]
                  events = (Input * (len(units) * 2))()
                  for i, unit in enumerate(units):
                      for j, flags in enumerate((4, 6)):
                          events[i * 2 + j].kind = 1
                          events[i * 2 + j].payload.keyboard = Keyboard(0, unit, flags, 0, 0)
                  user.SendInput.argtypes = [w.UINT, ctypes.POINTER(Input), ctypes.c_int]
                  user.SendInput.restype = w.UINT
                  if user.SendInput(len(events), events, ctypes.sizeof(Input)) != len(events):
                      raise ctypes.WinError(ctypes.get_last_error())
              elif sys.platform == "linux":
                  subprocess.run(["xdotool", "type", "--clearmodifiers", "--delay", "1", str(path)],
                                 check=True, timeout=10)
              else:
                  subprocess.run(["osascript", "-e", 'tell application "System Events" to keystroke ' + json.dumps(str(path))],
                                 check=True, timeout=10)

          def capture(path):
              require_owned_focus()
              if sys.platform == "darwin":
                  subprocess.run(["screencapture", "-x", "-l", str(window["id"]), str(path)],
                                 check=True, timeout=20)
                  return np.asarray(Image.open(path).convert("RGB"))
              pixels = ImageGrab.grab(bbox=window.get("bounds"))
              pixels.save(path)
              return np.asarray(pixels.convert("RGB"))

          def require_owned_focus():
              if sys.platform == "win32":
                  from ctypes import wintypes as w
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  user.GetForegroundWindow.restype = w.HWND
                  user.GetWindowThreadProcessId.argtypes = [w.HWND, ctypes.POINTER(w.DWORD)]
                  pid = w.DWORD()
                  user.GetWindowThreadProcessId(user.GetForegroundWindow(), ctypes.byref(pid))
                  owner = pid.value
              elif sys.platform == "linux":
                  active = subprocess.run(["xdotool", "getwindowfocus"], capture_output=True,
                                          text=True, check=True, timeout=5).stdout.strip()
                  owner = int(subprocess.run(["xdotool", "getwindowpid", active], capture_output=True,
                                             text=True, check=True, timeout=5).stdout.strip())
              else:
                  owner = int(subprocess.run(["osascript", "-e", 'tell application "System Events" '
                                              'to get unix id of first application process whose frontmost is true'],
                                             capture_output=True, text=True, check=True, timeout=5).stdout.strip())
              if owner not in refresh_owned():
                  raise RuntimeError("Desktop focus belongs to another application; no input sent")

          def focus_main_window():
              if sys.platform == "win32":
                  from ctypes import wintypes as w
                  user = ctypes.WinDLL("user32", use_last_error=True)
                  user.SetForegroundWindow.argtypes = [w.HWND]
                  user.SetForegroundWindow.restype = w.BOOL
                  user.GetForegroundWindow.restype = w.HWND
                  user.SetWindowPos.argtypes = [w.HWND, w.HWND, ctypes.c_int, ctypes.c_int,
                                               ctypes.c_int, ctypes.c_int, w.UINT]
                  user.SetWindowPos(window["id"], 0, 0, 0, 0, 0, 0x43)
                  if not user.SetForegroundWindow(window["id"]):
                      kernel = ctypes.WinDLL("kernel32", use_last_error=True)
                      kernel.GetCurrentThreadId.restype = w.DWORD
                      current = kernel.GetCurrentThreadId()
                      user.GetWindowThreadProcessId.argtypes = [w.HWND, ctypes.POINTER(w.DWORD)]
                      user.GetWindowThreadProcessId.restype = w.DWORD
                      foreground = user.GetWindowThreadProcessId(user.GetForegroundWindow(), None)
                      user.AttachThreadInput.argtypes = [w.DWORD, w.DWORD, w.BOOL]
                      user.AttachThreadInput.restype = w.BOOL
                      attached = foreground != current and user.AttachThreadInput(current, foreground, True)
                      try:
                          user.SetForegroundWindow(window["id"])
                      finally:
                          if attached:
                              user.AttachThreadInput(current, foreground, False)
                  # Activation crosses input queues; wait before checking ownership.
                  deadline = time.monotonic() + 2
                  while user.GetForegroundWindow() != window["id"] and time.monotonic() < deadline:
                      check_signal()
                      time.sleep(0.05)
              elif sys.platform == "linux":
                  subprocess.run(["xdotool", "windowfocus", "--sync", str(window["id"])], check=True, timeout=5)
              else:
                  subprocess.run(["osascript", "-e", 'tell application "System Events" to set frontmost of '
                                  f'(first application process whose unix id is {window["pid"]}) to true'],
                                 check=True, timeout=5)
              require_owned_focus()

          def mac_file_dialog(action):
              require_owned_focus()
              script = ('tell application "System Events"\n'
                        f'tell (first application process whose unix id is {window["pid"]})\n'
                        'log "Checking coordinate window"\n'
                        'if exists window "Mesh coordinates" then return "coordinates"\n'
                        'log "Checking front window"\n'
                        'if not (exists front window) then return "waiting"\n'
                        'set uiDialog to get front window\n'
                        'log ("Front window: " & (name of uiDialog))\n'
                        'set uiHasSheet to false\n'
                        'repeat 2 times\n'
                        'log "Checking attached sheet"\n'
                        'if not (exists sheet 1 of uiDialog) then exit repeat\n'
                        'set uiDialog to get sheet 1 of uiDialog\n'
                        'set uiHasSheet to true\n'
                        'log "Attached sheet found"\n'
                        'end repeat\n'
                        'set uiContainers to {uiDialog}\n'
                        'set uiLevel to {uiDialog}\n'
                        'repeat 3 times\n'
                        'set uiNextLevel to {}\n'
                        'repeat with uiParent in uiLevel\n'
                        'log "Checking dialog groups"\n'
                        'set uiGroups to get groups of uiParent\n'
                        'set uiSplitGroups to get splitter groups of uiParent\n'
                        'log ("Containers: groups=" & (count uiGroups) & ", split groups=" & (count uiSplitGroups))\n'
                        'set uiGroups to uiGroups & uiSplitGroups\n'
                        'repeat with uiGroup in uiGroups\n'
                        'if (count uiContainers) >= 24 then error "Dialog group limit exceeded"\n'
                        'set end of uiNextLevel to contents of uiGroup\n'
                        'set end of uiContainers to contents of uiGroup\n'
                        'end repeat\n'
                        'end repeat\n'
                        'if (count uiNextLevel) = 0 then exit repeat\n'
                        'set uiLevel to uiNextLevel\n'
                        'end repeat\n'
                        'repeat with uiDialog in uiContainers\n'
                        'log "Checking Go button"\n'
                        'if exists button "Go" of uiDialog then return "go"\n'
                        'end repeat\n')
              if action == "go":
                  script += ('if not uiHasSheet then return "waiting"\n'
                             'repeat with uiDialog in uiContainers\n'
                             'if exists button "Open" of uiDialog then return "waiting"\n'
                             'end repeat\n'
                             'repeat with uiDialog in uiContainers\n'
                             'log "Checking focused path input"\n'
                             'set uiFields to get text fields of uiDialog\n'
                             'set uiCombos to get combo boxes of uiDialog\n'
                             'repeat with uiField in (uiFields & uiCombos)\n'
                             'if enabled of uiField then\n'
                             'if value of attribute "AXFocused" of uiField then return "go"\n'
                             'end if\n'
                             'end repeat\n'
                             'end repeat\n'
                             'return "waiting"\n')
              else:
                  script += ('repeat with uiDialog in uiContainers\n'
                             'log "Checking Open button"\nif exists button "Open" of uiDialog then\n')
                  if action == "open":
                      script += ('if not (enabled of button "Open" of uiDialog) then return "waiting"\n'
                                 'log "Clicking Open button"\n'
                                 'click button "Open" of uiDialog\n')
                  script += 'return "open"\nend if\nend repeat\nreturn "waiting"\n'
              script += 'end tell\nend tell'
              try:
                  result = subprocess.run(["osascript", "-e", script], capture_output=True,
                                          text=True, check=False, timeout=5)
              except subprocess.TimeoutExpired as error:
                  detail = error.stderr or "No diagnostic output"
                  if isinstance(detail, bytes):
                      detail = detail.decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"macOS file dialog {action}: targeted Accessibility query timed out after 5s; "
                      f"the action was not retried. Last progress: {detail.strip()}") from error
              if result.returncode:
                  detail = result.stderr.strip() or result.stdout.strip() or "No diagnostic output"
                  raise RuntimeError(
                      f"macOS file dialog {action}: osascript exited {result.returncode}: {detail}")
              report["mac_file_dialog"] = {
                  "action": action, "state": result.stdout.strip(),
                  "diagnostics": result.stderr.strip(),
              }
              return result.stdout.strip()

          def mac_select_mesh(path):
              def wait_for(action, expected):
                  deadline = time.monotonic() + 30
                  state = "waiting"
                  while time.monotonic() < deadline:
                      check_signal()
                      if process.poll() is not None:
                          raise RuntimeError("Application exited during macOS file selection")
                      state = mac_file_dialog(action)
                      if state in expected:
                          return state
                      time.sleep(0.2)
                  raise RuntimeError(f"macOS file dialog timed out: {action=}, {state=}, {path=}")

              wait_for("ready", {"open"})
              send_keys("ctrl", "shift", "g")
              wait_for("go", {"go"})
              send_keys("ctrl", "a")
              type_path(path)
              send_keys("return")
              # Click only Open; a second Return could accept the coordinate dialog.
              wait_for("open", {"open", "coordinates"})

          def mac_mesh_coordinates(choice):
              require_owned_focus()
              script = ('tell application "System Events"\n'
                        f'set uiProcess to first application process whose unix id is {window["pid"]}\n'
                        'tell uiProcess\n'
                        'if not (exists window "Mesh coordinates") then error "Mesh coordinate dialog missing"\n'
                        'set uiDialog to window "Mesh coordinates"\n'
                        'set uiCombo to missing value\n'
                        'set uiOK to missing value\n'
                        'set uiLevel to {uiDialog}\n'
                        'set uiCount to 0\n'
                        'repeat 4 times\n'
                        'set uiNextLevel to {}\n'
                        'repeat with uiParent in uiLevel\n'
                        'set uiChildren to get UI elements of uiParent\n'
                        'repeat with uiChild in uiChildren\n'
                        'set uiCount to uiCount + 1\n'
                        'if uiCount > 64 then error "Coordinate dialog element limit exceeded"\n'
                        'set uiRole to role of uiChild\n'
                        'log {uiRole, name of uiChild}\n'
                        'if uiRole is "AXComboBox" or uiRole is "AXPopUpButton" '
                        'or uiRole is "AXMenuButton" then\n'
                        'set uiCombo to contents of uiChild\n'
                        'else if uiRole is "AXButton" then\n'
                        'if name of uiChild is "OK" then set uiOK to contents of uiChild\n'
                        'else if uiRole is "AXGroup" or uiRole is "AXSplitGroup" '
                        'or uiRole is "AXScrollArea" or uiRole is "AXSheet" then\n'
                        'set end of uiNextLevel to contents of uiChild\n'
                        'end if\n'
                        'end repeat\n'
                        'end repeat\n'
                        'if uiCombo is not missing value and uiOK is not missing value then exit repeat\n'
                        'if (count uiNextLevel) = 0 then exit repeat\n'
                        'set uiLevel to uiNextLevel\n'
                        'end repeat\n'
                        'if uiCombo is missing value then error "Coordinate combo not found"\n'
                        'if uiOK is missing value then error "Coordinate OK button not found"\n')

              def run_script(source, phase):
                  try:
                      result = subprocess.run(["osascript", "-e", source], capture_output=True,
                                              text=True, check=False, timeout=5)
                  except subprocess.TimeoutExpired as error:
                      detail = error.stderr or "No diagnostic output"
                      if isinstance(detail, bytes):
                          detail = detail.decode("utf-8", errors="replace")
                      raise RuntimeError(
                          f"macOS coordinate choice {choice} ({phase}): timed out; {detail}") from error
                  if result.returncode:
                      raise RuntimeError(
                          f"macOS coordinate choice {choice} ({phase}): {result.stderr.strip()}")
                  return result

              # Qt 6.7's Cocoa accessibility cells can crash on popup destruction.
              # Navigate the open popup without enumerating its rows or cells, then
              # verify the committed label before accepting the coordinate dialog.
              run_script(script + 'click uiCombo\nend tell\nend tell', "open combo")
              time.sleep(0.2)
              send_keys("home")
              send_keys("down")
              if choice == "LPS":
                  send_keys("down")
              send_keys("return")
              time.sleep(0.2)
              require_owned_focus()
              script += ('if role of uiCombo is "AXMenuButton" then\n'
                         'set uiChoice to get name of uiCombo\n'
                         'else\n'
                         'set uiChoice to get value of uiCombo\n'
                         'end if\n'
                         f'if uiChoice is not "{choice} (mm)" then '
                         'error ("Coordinate selection mismatch: " & uiChoice)\n'
                         'if not (enabled of uiOK) then '
                         'error "Coordinate acceptance is disabled"\n'
                         'click uiOK\nend tell\nend tell')
              run_script(script, "accept coordinates")

          def accept_mesh_coordinates(path):
              choice = "from_file"
              send_keys("return")
              if path.suffix.lower() == ".obj":
                  time.sleep(0.3)
                  if not windows(refresh_owned(), "Mesh coordinates"):
                      raise RuntimeError("OBJ accepted missing SPACE metadata without an explicit choice")
                  choice = "LPS" if path.suffix == ".OBJ" else "RAS"
                  if sys.platform == "darwin":
                      mac_mesh_coordinates(choice)
                  else:
                      # QDialog initially focuses its first input, the coordinate combo.
                      send_keys("home")
                      send_keys("down")
                      if choice == "LPS":
                          send_keys("down")
                      send_keys("return")
              time.sleep(2)
              if windows(refresh_owned(), "Mesh coordinates"):
                  raise RuntimeError(f"Mesh coordinate dialog did not accept {choice}")
              return choice

          def mac_wait_for_main_window(path):
              import ApplicationServices as ax

              state = {"file": path.name, "pid": window["pid"]}
              report["mac_mesh_window"] = state
              application = ax.AXUIElementCreateApplication(window["pid"])
              error = ax.AXUIElementSetMessagingTimeout(application, 0.5)
              if error:
                  raise RuntimeError(f"macOS main-window AX timeout setup failed: {error}")
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline:
                  check_signal()
                  state["returncode"] = process.poll()
                  if state["returncode"] is not None:
                      raise RuntimeError(f"Mesh {path.name}: application exited with code {state['returncode']}")
                  pids = refresh_owned()
                  if window["pid"] not in pids:
                      raise RuntimeError(f"Mesh {path.name}: owned GUI process disappeared")
                  error, focused = ax.AXUIElementCopyAttributeValue(application, "AXFocusedWindow", None)
                  state.update(ax_error=error, title="")
                  if not error and focused is not None:
                      error, caption = ax.AXUIElementCopyAttributeValue(focused, "AXTitle", None)
                      state.update(ax_error=error, title=caption or "")
                      if error and error not in (ax.kAXErrorNoValue, ax.kAXErrorAttributeUnsupported):
                          raise RuntimeError(f"Mesh {path.name}: AXTitle failed with AX error {error}")
                  elif error not in (0, ax.kAXErrorNoValue, ax.kAXErrorAttributeUnsupported):
                      raise RuntimeError(f"Mesh {path.name}: AXFocusedWindow failed with AX error {error}")
                  if state["title"] == title:
                      visible = windows(pids)
                      if any(item["id"] == window["id"] and item["pid"] == window["pid"] for item in visible):
                          focus_main_window()
                          return True
                  elif state["title"]:
                      raise RuntimeError(f"Mesh {path.name}: unexpected window {state['title']!r}")
                  time.sleep(0.1)
              raise RuntimeError(f"Mesh {path.name}: main window did not return; {state}")

          def has_mesh_file_dialog(visible):
              for item in visible:
                  caption = item["title"].removesuffix(" \u2014 TractEdit")
                  if caption == "Load Mesh" or (
                      caption.startswith("Load Mesh (destination: ") and caption.endswith(")")
                  ):
                      return True
              return False

          def windows_open_mesh_dialog():
              focus_main_window()
              send_keys("alt", "f")
              deadline = time.monotonic() + 15
              phase = "file_menu"
              confirm_after = 0
              while time.monotonic() < deadline:
                  check_signal()
                  if process.poll() is not None:
                      raise RuntimeError("Application exited while opening Load Mesh")
                  visible = windows(refresh_owned(), None)
                  report["mesh_file_dialog"] = {"phase": phase, "windows": visible}
                  if has_mesh_file_dialog(visible):
                      return
                  menu_visible = any("QWindowPopup" in item.get("class", "") for item in visible)
                  if menu_visible and phase == "file_menu":
                      send_keys("m")
                      phase = "mesh_mnemonic"
                      confirm_after = time.monotonic() + 0.3
                  elif menu_visible and phase == "mesh_mnemonic" and time.monotonic() >= confirm_after:
                      # Confirm only while the mnemonic still leaves a Qt menu open.
                      send_keys("return")
                      phase = "file_dialog"
                  time.sleep(0.1)
              raise RuntimeError(f"Load Mesh file dialog did not open; no path entered ({phase=})")

          def mesh_smoke():
              folder = Path(os.environ["RUNNER_TEMP"]) / "mesh-smoke"
              folder.mkdir()
              ply = folder / "surface.ply"
              # Coplanar, separated bands stay observable with opaque surfaces.
              ply.write_text("ply\nformat ascii 1.0\ncomment SPACE=RAS\nelement vertex 8\n"
                             "property float x\nproperty float y\nproperty float z\nelement face 4\n"
                             "property list uchar int vertex_indices\nend_header\n"
                             "-30 -30 0\n30 -30 0\n30 -24 0\n-30 -24 0\n"
                             "-30 24 0\n30 24 0\n30 30 0\n-30 30 0\n"
                             "3 0 1 2\n3 0 2 3\n3 4 5 6\n3 4 6 7\n")
              vtp = folder / "surface.vtp"
              vtp.write_text('<VTKFile type="PolyData" version="0.1" byte_order="LittleEndian"><PolyData>'
                             '<FieldData><Array type="String" Name="SPACE" NumberOfTuples="1" format="ascii">'
                             '82 65 83 0</Array></FieldData><Piece NumberOfPoints="4" NumberOfPolys="2">'
                             '<Points><DataArray type="Float32" NumberOfComponents="3" format="ascii">'
                             '-30 -22 0 30 -22 0 30 -8 0 -30 -8 0</DataArray></Points>'
                             '<Polys><DataArray type="Int32" Name="connectivity" format="ascii">0 1 2 0 2 3</DataArray>'
                             '<DataArray type="Int32" Name="offsets" format="ascii">3 6</DataArray></Polys>'
                             '</Piece></PolyData></VTKFile>')
              obj = folder / "surface.obj"
              obj.write_text("# SPACE=LPS is not authoritative OBJ metadata\n"
                             "o cortex\ng surface\nv -30 -7 0\nv 30 -7 0\n"
                             "v 30 7 0\nv -30 7 0\nf 1 2 3 4\n", encoding="ascii")
              obj_lps = folder / "surface_lps.OBJ"
              obj_lps.write_text("v -30 -22 0\nv 30 -22 0\nv 30 -8 0\nv -30 -8 0\n"
                                 "f -4 -3 -2\nf -4 -2 -1\n", encoding="ascii")
              focus_main_window()
              baseline = capture(evidence / "mesh-before.png")
              report["mesh_smoke"] = []
              for path in (ply, vtp, obj, obj_lps):
                  if sys.platform == "darwin":
                      subprocess.run(["osascript", "-e", 'tell application "System Events" to tell '
                                      f'(first application process whose unix id is {window["pid"]})\n'
                                      'click menu bar item "File" of menu bar 1\n'
                                      'click menu item "Load Mesh..." of menu 1 of menu bar item "File" of menu bar 1\n'
                                      'end tell'],
                                     check=True, timeout=10)
                  elif sys.platform == "win32":
                      windows_open_mesh_dialog()
                  else:
                      send_keys("alt", "f")
                      send_keys("m")
                  if sys.platform == "linux":
                      # The Medoid action shares M, so Qt highlights before triggering.
                      time.sleep(0.2)
                      send_keys("return")
                  time.sleep(1)
                  if (
                      sys.platform != "darwin"
                      and not has_mesh_file_dialog(windows(refresh_owned(), None))
                  ):
                      raise RuntimeError("Load Mesh file dialog did not open; no path entered")
                  if sys.platform == "darwin":
                      mac_select_mesh(path)
                  else:
                      if sys.platform == "win32":
                          send_keys("alt", "n")
                          send_keys("ctrl", "a")
                      else:
                          send_keys("ctrl", "l")
                      type_path(path)
                      send_keys("return")
                  deadline = time.monotonic() + 30
                  while not windows(refresh_owned(), "Mesh coordinates"):
                      check_signal()
                      if process.poll() is not None or time.monotonic() > deadline:
                          raise RuntimeError(f"Mesh coordinate dialog missing for {path.suffix}")
                      time.sleep(0.2)
                  coordinate_choice = accept_mesh_coordinates(path)
                  if sys.platform == "win32":
                      user = ctypes.WinDLL("user32")
                      user.GetForegroundWindow.restype = ctypes.c_void_p
                      main_active = user.GetForegroundWindow() == window["id"]
                  elif sys.platform == "linux":
                      unexpected = []
                      for candidate in windows(refresh_owned(), None):
                          if candidate["id"] == window["id"]:
                              continue
                          properties = subprocess.run(
                              ["xprop", "-id", str(candidate["id"]), "_NET_WM_WINDOW_TYPE"],
                              capture_output=True, text=True, check=True, timeout=5).stdout
                          if "_NET_WM_WINDOW_TYPE_DIALOG" in properties:
                              unexpected.append(candidate)
                      if unexpected:
                          raise RuntimeError(f"Mesh import left a dialog: {unexpected}")
                      # Xvfb without a window manager returns focus to the root.
                      focus_main_window()
                      focused = subprocess.run(["xdotool", "getwindowfocus"], capture_output=True,
                                               text=True, check=True, timeout=5).stdout.strip()
                      main_active = int(focused) == window["id"]
                  else:
                      main_active = mac_wait_for_main_window(path)
                  if not main_active:
                      raise RuntimeError("Mesh import left an error dialog or lost main-window focus")
                  after = capture(evidence / ("mesh-after-" + path.name + ".png"))
                  if after.shape != baseline.shape:
                      raise RuntimeError("Window geometry changed during mesh smoke")
                  # Exclude menu/status and either docking side of the Data Panel.
                  delta = np.any(after[100:-70, 300:-300] != baseline[100:-70, 300:-300], axis=-1)
                  changed = int(np.count_nonzero(delta))
                  report["mesh_smoke"].append({"file": path.name, "format": path.suffix,
                                               "coordinate_choice": coordinate_choice,
                                               "changed_scene_pixels": changed})
                  if changed < 5000:
                      raise RuntimeError(f"Mesh {path.name} did not change the rendered scene: {changed} pixels")
                  baseline = after

          try:
              env = os.environ.copy()
              for key in ("PYTHONPATH", "PYTHONHOME", "QT_QPA_PLATFORM", "APPIMAGE_EXTRACT_AND_RUN"):
                  env.pop(key, None)
              if sys.platform == "linux":
                  env["QT_QPA_PLATFORM"] = "xcb"
                  env["QT_DEBUG_PLUGINS"] = "1"
                  if os.environ.get("TARGET") == "appimage":
                      env["APPIMAGE_EXTRACT_AND_RUN"] = "1"
              check_signal()
              started = time.monotonic()
              with (evidence / "gui.log").open("w") as log:
                  process = subprocess.Popen(
                      [os.environ["EXECUTABLE"]], cwd=os.environ["RUNNER_TEMP"], env=env,
                      stdout=log, stderr=subprocess.STDOUT, start_new_session=(os.name != "nt"))
                  owned.add(psutil.Process(process.pid))
                  window = None
                  deadline = started + 90
                  while time.monotonic() < deadline:
                      check_signal()
                      if process.poll() is not None:
                          raise RuntimeError(f"Application exited before GUI: {process.returncode}")
                      candidates = windows(refresh_owned())
                      if candidates:
                          window = candidates[0]
                          break
                      time.sleep(1)
                  appeared = time.monotonic()
                  if window is None or appeared > deadline:
                      raise RuntimeError("Main window not observable within 90s; check desktop permissions and logs")
                  report.update(window=window, window_seconds=round(appeared - started, 3))
                  until = max(started + 30, appeared + 15)
                  while time.monotonic() < until:
                      check_signal()
                      if process.poll() is not None or window["pid"] not in refresh_owned():
                          raise RuntimeError("Application ended during GUI observation")
                      time.sleep(1)
                  visible = windows(refresh_owned())
                  if not any(x["id"] == window["id"] and x["pid"] == window["pid"] for x in visible):
                      raise RuntimeError("Main window disappeared")
                  screenshot = evidence / ("gui.xwd" if sys.platform == "linux" else "gui.png")
                  focus_main_window()
                  if sys.platform == "win32":
                      from PIL import ImageGrab
                      ImageGrab.grab(bbox=window["bounds"], all_screens=True).save(screenshot)
                  elif sys.platform == "darwin":
                      subprocess.run(["screencapture", "-x", "-l", str(window["id"]), str(screenshot)],
                                     check=True, timeout=20)
                  else:
                      subprocess.run(["xwd", "-silent", "-id", str(window["id"]), "-out", str(screenshot)],
                                     check=True, timeout=20)
                  if screenshot.stat().st_size == 0:
                      raise RuntimeError("Empty GUI screenshot")
                  mesh_smoke()
                  check_signal()
                  report["observed_seconds"] = round(time.monotonic() - started, 3)
                  report["passed"] = True
          except BaseException as error:
              report["error"] = str(error)
              if globals().get("window"):
                  try:
                      report["visible_windows"] = windows(refresh_owned(), None)
                      capture(evidence / "gui-failure.png")
                  except Exception as diagnostic_error:
                      report["diagnostic_error"] = str(diagnostic_error)
              print(json.dumps(report, indent=2), flush=True)
              raise
          finally:
              try:
                  refresh_owned()
                  # Preserve Process objects so PID reuse cannot target an unrelated process.
                  for method in ("terminate", "kill"):
                      for item in owned:
                          try:
                              getattr(item, method)()
                          except psutil.NoSuchProcess:
                              pass
                      psutil.wait_procs(list(owned), timeout=3)
                      if process is not None:
                          process.poll()
                      if not refresh_owned():
                          break
                  remaining = refresh_owned()
                  report["cleanup_passed"] = not remaining
                  if remaining:
                      raise RuntimeError(f"GUI children survived cleanup: {sorted(remaining)}")
              except BaseException as error:
                  report["passed"] = False
                  report["cleanup_error"] = str(error)
                  raise
              finally:
                  if interrupted is not None:
                      report["passed"] = False
                      report["termination_signal"] = interrupted
                  (evidence / "gui.json").write_text(json.dumps(report, indent=2) + "\n")
          check_signal()
          ''', encoding="utf-8")
      # Install a host graphics driver only in the disposable Windows validation VM.
      # No Mesa DLLs are copied into the ZIP or its extracted application directory.
      - name: Install pinned Mesa software renderer for Windows tests
        if: matrix.enabled && matrix.target == 'exe'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'System-wide Mesa deployment is restricted to disposable GitHub-hosted runners.'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The Windows validation runner must have administrator rights.'
          }
          $packageHash = (Get-FileHash -LiteralPath $env:PACKAGE -Algorithm SHA256).Hash
          $executableHash = (Get-FileHash -LiteralPath $env:EXECUTABLE -Algorithm SHA256).Hash
          if ($packageHash.ToLowerInvariant() -ne $env:EXPECTED_SHA256) {
            throw 'The downloaded Windows ZIP identity changed.'
          }
          $mesaVersion = '26.2.3'
          $mesaHash = '3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          New-Item -ItemType Directory -Path $mesaRoot | Out-Null
          $archive = Join-Path $mesaRoot 'mesa.7z'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mesaHash) {
            throw 'Mesa archive SHA-256 mismatch.'
          }
          & 7z.exe x $archive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa archive extraction failed.' }
          & (Join-Path $mesaRoot 'systemwidedeploy.cmd') 1
          if ($LASTEXITCODE -ne 0) { throw 'Mesa system-wide deployment failed.' }
          if ((Get-FileHash -LiteralPath $env:PACKAGE -Algorithm SHA256).Hash -ne $packageHash -or
              (Get-FileHash -LiteralPath $env:EXECUTABLE -Algorithm SHA256).Hash -ne $executableHash) {
            throw 'Mesa setup unexpectedly changed the application under test.'
          }
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Mesa $mesaVersion, SHA-256: $mesaHash; CI-only system driver." |
            Set-Content -LiteralPath 'evidence/windows-mesa.log' -Encoding utf8

      - name: Require Windows OpenGL for GUI validation
        if: matrix.enabled && matrix.target == 'exe'
        shell: python {0}
        timeout-minutes: 2
        run: |
          import ctypes as c
          from ctypes import wintypes as w
          import json
          import re
          from pathlib import Path

          # Require the CI software driver before starting the unmodified packaged GUI.
          report = {"scope": "runner system WGL context", "measured": False}
          window = dc = context = None
          user = c.WinDLL("user32", use_last_error=True)
          gdi = c.WinDLL("gdi32", use_last_error=True)
          gl = c.WinDLL("opengl32", use_last_error=True)

          class PixelFormat(c.Structure):
              _fields_ = [("nSize", w.WORD), ("nVersion", w.WORD), ("dwFlags", w.DWORD)]
              _fields_ += [(name, w.BYTE) for name in (
                  "iPixelType cColorBits cRedBits cRedShift cGreenBits cGreenShift "
                  "cBlueBits cBlueShift cAlphaBits cAlphaShift cAccumBits cAccumRedBits "
                  "cAccumGreenBits cAccumBlueBits cAccumAlphaBits cDepthBits cStencilBits "
                  "cAuxBuffers iLayerType bReserved").split()]
              _fields_ += [(name, w.DWORD) for name in ("dwLayerMask", "dwVisibleMask", "dwDamageMask")]

          def bind(dll, name, result, arguments):
              fn = getattr(dll, name)
              fn.restype, fn.argtypes = result, arguments
              return fn

          create = bind(user, "CreateWindowExW", w.HWND,
                        [w.DWORD, w.LPCWSTR, w.LPCWSTR, w.DWORD, c.c_int, c.c_int,
                         c.c_int, c.c_int, w.HWND, w.HMENU, w.HINSTANCE, c.c_void_p])
          getdc = bind(user, "GetDC", w.HDC, [w.HWND])
          release = bind(user, "ReleaseDC", c.c_int, [w.HWND, w.HDC])
          destroy = bind(user, "DestroyWindow", w.BOOL, [w.HWND])
          choose = bind(gdi, "ChoosePixelFormat", c.c_int, [w.HDC, c.POINTER(PixelFormat)])
          setformat = bind(gdi, "SetPixelFormat", w.BOOL, [w.HDC, c.c_int, c.POINTER(PixelFormat)])
          createcontext = bind(gl, "wglCreateContext", c.c_void_p, [w.HDC])
          makecurrent = bind(gl, "wglMakeCurrent", w.BOOL, [w.HDC, c.c_void_p])
          deletecontext = bind(gl, "wglDeleteContext", w.BOOL, [c.c_void_p])
          getstring = bind(gl, "glGetString", c.c_char_p, [c.c_uint])
          getproc = bind(gl, "wglGetProcAddress", c.c_void_p, [c.c_char_p])

          def require(value, operation):
              if not value:
                  raise RuntimeError(f"{operation} failed (Win32 error {c.get_last_error()})")
              return value

          try:
              assert c.sizeof(PixelFormat) == 40
              window = require(create(0, "STATIC", "OpenGL diagnostics", 0x80000000,
                                      0, 0, 16, 16, None, None, None, None), "CreateWindowExW")
              dc = require(getdc(window), "GetDC")
              fmt = PixelFormat()
              fmt.nSize, fmt.nVersion = c.sizeof(fmt), 1
              fmt.dwFlags = 0x4 | 0x20 | 0x1  # Draw to window, support OpenGL, double buffer.
              fmt.cColorBits, fmt.cDepthBits, fmt.cStencilBits = 24, 24, 8
              index = require(choose(dc, c.byref(fmt)), "ChoosePixelFormat")
              require(setformat(dc, index, c.byref(fmt)), "SetPixelFormat")
              context = require(createcontext(dc), "wglCreateContext")
              require(makecurrent(dc, context), "wglMakeCurrent")
              for name, token in (("vendor", 0x1F00), ("renderer", 0x1F01), ("version", 0x1F02)):
                  value = require(getstring(token), f"glGetString({name})")
                  report[name] = value.decode("ascii", errors="replace")
              address = getproc(b"wglCreateContextAttribsARB")
              report["has_context_attribs_entrypoint"] = address not in (
                  None, 0, 1, 2, 3, c.c_void_p(-1).value)
              report["measured"] = True
          except Exception as error:
              report["error"] = str(error)
          finally:
              if context:
                  makecurrent(None, None)
                  deletecontext(context)
              if dc:
                  release(window, dc)
              if window:
                  destroy(window)
              Path("evidence").mkdir(exist_ok=True)
              text = json.dumps(report, indent=2)
              Path("evidence/windows-opengl.json").write_text(text + "\n", encoding="utf-8")
              print(text)
          version = re.match(r"(\d+)\.(\d+)", report.get("version", ""))
          if (not report["measured"] or not version
                  or tuple(map(int, version.groups())) < (3, 2)
                  or not report.get("has_context_attribs_entrypoint")):
              raise SystemExit("Runner lacks the OpenGL 3.2 context support required for VTK")
          if "llvmpipe" not in report.get("renderer", "").lower():
              raise SystemExit("Expected the pinned Mesa llvmpipe software renderer")

